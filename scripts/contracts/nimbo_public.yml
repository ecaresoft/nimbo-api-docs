                      - starts_at
                      - cause
                      - doctor_name
                      - doctor_image
                      - organization_name
                      - patient_name
                      - schedule_type
                      - status
                      - request_type
                      additionalProperties: false
                      properties:
                        id:
                          type: integer
                        starts_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        cause:
                          type:
                          - string
                          - 'null'
                        doctor_name:
                          type:
                          - string
                          - 'null'
