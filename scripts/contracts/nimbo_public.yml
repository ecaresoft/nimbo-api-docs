                    type: array
                    items:
                      type: object
                      required:
                      - active
                      - created_at
                      - description
                      - id
                      - key
                      - updated_at
                      additionalProperties: false
                      example:
                        id: 9501
                        key: '86121600'
                        description: Servicios hospitalarios de emergencia
                        active: true
                        created_at: '2022-03-01T20:46:11.467-06:00'
                        updated_at: '2022-03-01T20:46:11.467-06:00'
                      properties:
                        id:
