  "/api/v1/patient_portal/auth":
    post:
      tags:
      - Patient Portal Auth
      operationId: requestPatientPortalOtp
      summary: Request a patient portal OTP
      description: Requests an OTP for a phone number associated with a non-deleted
        patient portal person. Staging and production accept the request only after
        Twilio accepts a WhatsApp template message or its synchronous SMS fallback.
        Client errors use generic shapes and requests are rate limited by phone and
        IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country_code
              - phone
              additionalProperties: true
              properties:
                country_code:
                  type: string
                  pattern: "^\\+?[0-9]+$"
                  example: '52'
                phone:
                  type: string
                  pattern: "^[0-9]+$"
                  example: '5550100000'
      responses:
        '200':
          description: OTP accepted by the configured delivery provider. The response
            body is empty for legacy compatibility.
        '404':
          description: The supplied number is invalid or is not eligible for patient
            portal authentication.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                invalid_or_unknown_number:
                  value:
                    error: Invalid number
        '429':
          description: The request rate limit for the phone or source address was
            exceeded.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                rate_limited:
                  value:
                    error: Too many requests
        '503':
          description: OTP delivery or its shared rate-limit cache is unavailable.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                delivery_unavailable:
                  value:
                    error: OTP delivery is unavailable
  "/api/v1/patient_portal/validate":
    post:
      tags:
      - Patient Portal Auth
      operationId: validatePatientPortalOtp
      summary: Validate a patient portal OTP
      description: Validates an OTP and returns a patient portal JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country_code
              - phone
              - code
              additionalProperties: true
              properties:
                country_code:
                  type: string
                  pattern: "^\\+?[0-9]+$"
                  example: '52'
                phone:
                  type: string
                  pattern: "^[0-9]+$"
                  example: '5550100000'
                code:
                  type: string
                  pattern: "^[0-9]{4}$"
                  example: '0000'
      responses:
        '200':
          description: JWT issued after replacing token associations with non-deleted
            matching people.
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                additionalProperties: false
                properties:
                  token:
                    type: string
                    description: Patient portal JWT.
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        '404':
          description: Invalid number.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
        '429':
          description: The validation-attempt rate limit for the phone or source address
            was exceeded.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                rate_limited:
                  value:
                    error: Too many requests
        '503':
          description: The shared rate-limit cache is missing, invalid, or unavailable.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                cache_unavailable:
                  value:
                    error: OTP delivery is unavailable
