                          entries.
                        example: 2
        '404':
          description: The slug is blank, missing, or identifies an inactive entry
            point or room. The response body is empty.
  "/api/v1/patient_portal/auth":
    post:
      tags:
      - Patient Portal Auth
      operationId: requestPatientPortalOtp
      summary: Request a patient portal OTP
      security: []
      description: Requests an OTP for a phone number associated with a non-deleted
        patient portal person whose phone country is active. Provider delivery waits
        for Twilio to accept a WhatsApp template message or its synchronous SMS fallback.
        The synthetic staging environment can issue test codes without provider delivery.
        Client errors use generic shapes and requests are rate limited by phone and
        IP. An explicitly configured store-review test identity instead uses a reusable
        server credential with fixed fictional patient/organization bindings and an
        expiration; its request sends no provider message. An invalid or expired configuration
        fails closed for that identity. A successful ordinary resend replaces the
        existing code for that phone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country_code
              - phone
              additionalProperties: true
              properties:
                country_code:
                  type: string
                  pattern: "^\\+?[0-9]+$"
                  example: '52'
                phone:
                  type: string
                  pattern: "^[0-9]+$"
                  example: '5550100000'
                supports_six_digit_otp:
                  type: boolean
                  default: false
                  description: Send JSON true on initial requests and resends when
                    the client can enter either length. The server chooses the length
                    and returns it in code_length.
      responses:
        '200':
          description: OTP issued after provider acceptance or through staging test
            mode, or a configured review identity accepted without provider delivery.
            Requests with the JSON boolean supports_six_digit_otp set to true receive
            the actual code length. The length is four when six-digit issuance is
            disabled or for the store-review identity. All other requests have an
            empty body and use four digits.
          content:
            application/json:
              schema:
                type: object
                required:
                - code_length
                additionalProperties: false
                properties:
                  code_length:
                    type: integer
                    enum:
                    - 4
                    - 6
                    description: Number of digits to enter for this request. Use four
                      digits if an older API returns an empty success.
              examples:
                four_digits:
                  value:
                    code_length: 4
                six_digits:
                  value:
                    code_length: 6
        '404':
          description: The supplied number is invalid or is not eligible for patient
            portal authentication.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                invalid_or_unknown_number:
                  value:
                    error: Invalid number
        '429':
          description: The request rate limit for the phone or source address was
            exceeded.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                rate_limited:
                  value:
                    error: Too many requests
        '503':
          description: OTP delivery or its shared rate-limit cache is unavailable.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                delivery_unavailable:
                  value:
                    error: OTP delivery is unavailable
  "/api/v1/patient_portal/validate":
    post:
      tags:
      - Patient Portal Auth
      operationId: validatePatientPortalOtp
      summary: Validate a patient portal OTP
      security: []
      description: Validates an OTP and returns a patient portal JWT. Token associations
        include only non-deleted matching people whose phone country is active. The
        issued four- or six-digit ordinary code can be validated regardless of the
        current issuance setting. A valid ordinary OTP is consumed even if no eligible
        people remain. An opt-in store-review test identity accepts its reusable credential
        and issues a JWT restricted to explicitly approved fictional records in one
        organization. Missing, changed or expired review settings and changed record
        bindings deny these review sessions on subsequent patient portal requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country_code
              - phone
              - code
              additionalProperties: true
              properties:
                country_code:
                  type: string
                  pattern: "^\\+?[0-9]+$"
                  example: '52'
                phone:
                  type: string
                  pattern: "^[0-9]+$"
                  example: '5550100000'
                code:
                  type: string
                  pattern: "^(?:[0-9]{4}|[1-9][0-9]{5})$"
                  description: Enter the code at its issued length. Preserve any leading
                    zeros in a four-digit code.
                  example: '0000'
      responses:
        '200':
          description: JWT issued after replacing token associations with eligible
            matching people, restricted to the explicit record bindings for a configured
            review identity.
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                additionalProperties: false
                properties:
                  token:
                    type: string
                    description: Patient portal JWT.
        '401':
          description: The OTP is invalid, missing, or already consumed. Preserves
            the legacy Spanish validation error.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                invalid_code:
                  value:
                    error: No autorizado
        '404':
          description: Invalid number.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
        '429':
          description: The validation-attempt rate limit for the phone or source address
            was exceeded.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                rate_limited:
                  value:
                    error: Too many requests
        '503':
          description: The shared rate-limit cache is missing, invalid, or unavailable.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                cache_unavailable:
                  value:
                    error: OTP delivery is unavailable
  "/api/v1/patient_portal/people":
