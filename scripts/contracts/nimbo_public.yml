                              type: string
                              example: demo-north-entrance
                            active:
                              type: boolean
                              example: true
                            created_at:
                              type: string
                              example: '2026-01-01T06:00:00.000-06:00'
                            updated_at:
                              type: string
                              example: '2026-01-01T06:00:00.000-06:00'
                        - type: 'null'
                      entry_points_count:
                        type: integer
                        minimum: 0
