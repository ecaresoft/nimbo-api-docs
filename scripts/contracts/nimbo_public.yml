          description: Waiting-room configuration.
          content:
            application/json:
              schema:
                type: object
                required:
                - waiting_room
                additionalProperties: false
                properties:
                  waiting_room:
                    type: object
                    required:
                    - id
                    - organization_id
                    - name
                    - slug
                    - schedule_configuration
                    - waiting_room_configuration
                    - created_at
                    - updated_at
                    - selected_accounts
                    - custom_field_ids
                    - entry_point
                    - entry_points_count
                    additionalProperties: false
                    properties:
                      id:
                        type: integer
                        example: 901
                      organization_id:
                        type:
                        - integer
                        - 'null'
                        example: 123
                      name:
                        type:
                        - string
                        - 'null'
                      slug:
                        type:
                        - string
                        - 'null'
                      schedule_configuration:
                        type: object
                        additionalProperties: true
                      waiting_room_configuration:
                        type: object
                        additionalProperties: true
                      created_at:
                        type: string
                        example: '2026-01-01T06:00:00.000-06:00'
                      updated_at:
                        type: string
                        example: '2026-01-01T06:00:00.000-06:00'
                      selected_accounts:
                        type: array
                        items:
                          type: integer
                        example:
                        - 456
                      custom_field_ids:
                        description: Associated custom fields excluding soft-deleted
                          fields, in configured order. Field and join active flags
                          do not filter this list.
                        type: array
                        items:
                          type: integer
                        example: []
                      entry_point:
                        oneOf:
                        - type: object
                          additionalProperties: false
                          required:
                          - id
                          - waiting_room_id
                          - name
                          - slug
                          - active
                          - created_at
                          - updated_at
                          properties:
                            id:
                              type: integer
                              example: 902
                            waiting_room_id:
                              type: integer
                              example: 901
                            name:
