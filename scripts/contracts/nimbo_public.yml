  "/api/v1/patient_portal/people/{person_id}/consultation_schedules":
    get:
      tags:
      - Patient Portal
      operationId: listPatientPortalPersonConsultationSchedules
      summary: List authorized patient consultation schedules
      description: 'Pagination defaults to page 1 and per_page 10. Values above 100
        are accepted and clamped to 100 before limit, offset and total_pages; nonpositive
        or nonnumeric page sizes use 10. Resolves the patient through the authenticated
        patient token. Without scope=history (including unknown scope values), the
        existing response is unchanged: kept schedules starting at Time.zone.yesterday
        in the application timezone, ascending starts_at/id, or descending for state=unstarted.
        Only scope=history adds recorded organization and current location address/contact
        objects alongside the lifecycle fields and returns all past and future kept
        schedules plus deleted rows explicitly marked cancellation_request_accepted,
        ordered starts_at DESC, id DESC. Generic deletions remain hidden; this does
        not reconstruct every staff cancellation. History state=unstarted excludes
        only schedules with an authorized kept consultation through an owned, kept
        encounter. Accepted cancellations with no linked consultation remain in history
        when state=unstarted; default unstarted behavior remains unchanged. History
        consultation status is started whenever a linked consultation exists (use
        consultation_finished_at for completion), otherwise cancelled for accepted
        cancellation, arrived for check-in, then the existing cancellation/confirmation/scheduled
        presentation. Explicit cancellation, arrival and missed evidence remains independent;
        no missing consultation or elapsed timestamp implies a no-show. Missing, foreign
        or deleted encounter context yields null organization/location; inactive locations
        and stored placeholder values remain available. History never offers confirm/cancel
        for canceled, missed, checked-in or started rows; remaining action eligibility
        retains existing notice, organization and payment restrictions. Clinical detail
        uses consultation_id, never the schedule or encounter ID. Historical pages
        can be loaded independently of the existing upcoming list. No writes or provider
        delivery occur.'
      security:
      - PatientPortalToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: integer
        example: 123
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: per_page
        in: query
        required: false
        description: Requested page size; values above 100 are accepted and clamped
          to 100 before limit, offset and total_pages calculations. Nonpositive handling
          is operation-specific.
        schema:
          type: integer
          minimum: 1
          default: 10
        example: 10
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum:
          - unstarted
        example: unstarted
      - name: scope
        in: query
        required: false
        description: The exact value history opts into complete schedules and lifecycle
          fields. Omitted and all other values preserve the existing response.
        schema:
          type: string
        example: history
      responses:
        '200':
          description: Existing recent schedules, or the extended complete history
            projection only when scope=history is requested.
          content:
            application/json:
              schema:
                type: object
                required:
                - consultation_schedules
                - meta
                additionalProperties: false
                properties:
                  consultation_schedules:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        required:
                        - id
                        - cause
                        - starts_at
                        - ends_at
                        - doctor_name
                        - doctor_image
                        - organization_name
                        - patient_name
                        - schedule_type
                        - status
                        - can_confirm_schedule
                        - can_cancel_schedule
                        - doctor_speciality
                        - doctor_speciality_es
                        - doctor_speciality_en
                        additionalProperties: false
                        properties:
                          id:
                            type: integer
                          cause:
                            type:
                            - string
                            - 'null'
                          starts_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          ends_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          doctor_name:
                            type:
                            - string
                            - 'null'
                          doctor_image:
                            type: string
                          organization_name:
                            type:
                            - string
                            - 'null'
                          patient_name:
                            type: string
                          schedule_type:
                            type:
                            - string
                            - 'null'
                          status:
                            type:
                            - string
                            - 'null'
                          can_confirm_schedule:
                            type: boolean
                          can_cancel_schedule:
                            type: boolean
                          doctor_speciality:
                            type:
                            - string
                            - 'null'
                          doctor_speciality_es:
                            type:
                            - string
                            - 'null'
                          doctor_speciality_en:
                            type:
                            - string
                            - 'null'
                      - type: object
                        description: Opt-in scope=history projection of one scheduled
                          encounter. Consultation identity is resolved through the
                          authorized patient and a kept, owned encounter. A null consultation_id
                          means no accessible kept consultation; it never establishes
                          nonattendance. Private consultation causes are masked. No
                          internal metadata or clinical detail is included. Specialties
                          can be null when the schedule account is unavailable. Existing
                          clients receive ConsultationSchedule.
                        additionalProperties: false
                        required:
                        - id
                        - cause
                        - starts_at
                        - ends_at
                        - doctor_name
                        - doctor_image
                        - organization_name
                        - patient_name
                        - schedule_type
                        - status
                        - can_confirm_schedule
                        - can_cancel_schedule
                        - doctor_speciality
                        - doctor_speciality_es
                        - doctor_speciality_en
                        - encounter_id
                        - consultation_id
                        - consultation_finished_at
                        - arrival_at
                        - missed_at
                        - cancellation_status
                        - cancelled_at
                        - time_zone
                        - organization
                        - location
                        properties:
                          organization:
                            type:
                            - object
                            - 'null'
                            description: Organization of the recorded location on
                              the same patient's kept encounter, independently of
                              the physician account's current organization. Null when
                              the encounter or location is absent or soft-deleted,
                              or the organization cannot be resolved. Never inferred
                              from a sole/default branch.
                            required:
                            - id
                            - name
                            additionalProperties: false
                            properties:
                              id:
                                type: integer
                              name:
                                type:
                                - string
                                - 'null'
                            example:
                              id: 101
                              name: Example Clinic
                          location:
                            type:
                            - object
                            - 'null'
                            description: Recorded encounter location with its current
                              address and contact information. Uses the same resolution
                              and historical-membership rules as the summary. Every
                              documented field is present for an existing location.
                              Address, city, postal code and telephone preserve stored
                              strings, including empty strings and placeholders; numeric
                              values are serialized as strings without inferring missing
                              formatting or leading zeros. Missing, boolean, array
                              and object field values are null. A non-object office
                              store makes these four text fields null without hiding
                              the location or its geography. No organization or physician
                              address/contact fallback is applied.
                            required:
                            - id
                            - name
                            - active
                            - address
                            - city
                            - postal_code
                            - telephone
                            - state
                            - country
                            additionalProperties: false
                            properties:
                              id:
                                type: integer
                              name:
                                type:
                                - string
                                - 'null'
                              active:
                                type:
                                - boolean
                                - 'null'
                                description: Stored operational status; false does
                                  not remove a historical location.
                              address:
                                type:
                                - string
                                - 'null'
                                description: Branch address as text, without inferred
                                  formatting or supplementation.
                              city:
                                type:
                                - string
                                - 'null'
                              postal_code:
                                type:
                                - string
                                - 'null'
                              telephone:
                                type:
                                - string
                                - 'null'
                              state:
                                type:
                                - object
                                - 'null'
                                description: Location's state, or null when not configured
                                  or no longer resolvable.
                                required:
                                - id
                                - name
                                additionalProperties: false
                                properties:
                                  id:
                                    type: integer
                                  name:
                                    type:
                                    - string
                                    - 'null'
                              country:
                                type:
                                - object
                                - 'null'
                                description: State's country, including inactive countries;
                                  null when not resolvable.
                                required:
                                - id
                                - name_es
                                - name_en
                                - code
                                additionalProperties: false
