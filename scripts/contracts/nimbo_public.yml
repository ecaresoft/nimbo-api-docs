  "/api/v1/specialties/{id}":
    get:
      tags:
      - Catalogs
      operationId: getSpecialty
      summary: Get a specialty
      description: 'Requires an existing legacy staff OAuth token. Bearer Authorization
        takes precedence over legacy access_token and bearer_token query aliases.
        Revoked and expired tokens are rejected. Does not issue or refresh tokens.

        '
      security:
      - LegacyStaffToken: []
      - LegacyStaffAccessTokenQuery: []
      - LegacyStaffBearerTokenQuery: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: '123'
      responses:
        '200':
          description: Specialty with the legacy response root.
          content:
            application/json:
              schema:
                type: object
                required:
                - specialty
                additionalProperties: false
                properties:
                  specialty:
                    type: object
                    required:
                    - id
                    - name_en
                    - name_es
                    additionalProperties: false
                    example:
                      id: 3001
                      name_en: General Medicine
                      name_es: Medicina General
                    properties:
                      id:
                        type: integer
                      name_en:
                        type:
                        - string
                        - 'null'
                      name_es:
                        type:
                        - string
                        - 'null'
        '401':
          description: Missing, unknown, expired or revoked staff token; empty body
            and Bearer challenge.
        '404':
          description: The requested resource was not found or is outside the authorized
            patient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_found:
                  value:
                    error: Not found
        '403':
          description: The current organization's owner must have a verified cellphone.
            Recovery actions are explicitly exempt; the member's own verification
            does not substitute for the owner's. The message is always rendered in
            the API default locale; legacy answers in whichever locale the previous
            request left on the process, and that leaked state is deliberately not
            reproduced.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - organization_owner_cellphone_unverified
                  message:
                    type: string
                example:
                  error: organization_owner_cellphone_unverified
                  message: El propietario de la organización debe verificar su celular
                    para continuar.
