        in: path
        required: true
        schema:
          type: integer
        example: 123
      responses:
        '200':
          description: Pending matching consultation requests for the authorized patient.
          content:
            application/json:
              schema:
                type: object
                required:
                - consultation_requests
                additionalProperties: false
                properties:
                  consultation_requests:
                    type: array
                    items:
                      type: object
                      required:
