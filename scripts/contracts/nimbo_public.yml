      description: Resolves an active room's canonical slug or an active entry-point
        slug whose parent room is active. Canonical active rooms take precedence.
        Returns the parent configuration and canonical slug, with entry_point metadata
        for entry-point links (null for canonical links). The client passes entry_point.id
        when joining the queue to retain origin attribution. entry_points_count includes
        active and inactive entries for that room. Lookup is public and global by
        slug; organization_id does not scope it. Blank, missing, or inactive destinations
        return an empty 404 response. This follows legacy develop's entry-point enhancement
        and replaces the previous behavior that allowed inactive canonical rooms.
      parameters:
