  "/api/v1/sat/measurement_units":
    get:
      tags:
      - SAT Catalogs
      operationId: listSatMeasurementUnits
      summary: Search SAT measurement units
      description: Rows are returned in legacy id-ascending order with the full legacy
        column set, including timestamps rendered in the legacy application time zone
        (`America/Monterrey`).
      parameters:
      - name: query
        in: query
        required: false
        description: Literal, case-insensitive substring matched against the key or
          unaccented description. SQL wildcard characters such as `%` and `_` are
          treated literally. Omitted or blank input uses `servicio`.
        schema:
          type: string
      responses:
        '200':
          description: SAT measurement units wrapped in the legacy `measurement_units`
            root.
          content:
            application/json:
              schema:
                type: object
                required:
                - measurement_units
                additionalProperties: false
                properties:
                  measurement_units:
                    type: array
                    items:
                      type: object
                      required:
                      - active
                      - created_at
                      - description
                      - id
                      - key
                      - updated_at
                      additionalProperties: false
                      example:
                        id: 9501
                        key: '86121600'
                        description: Servicios hospitalarios de emergencia
                        active: true
                        created_at: '2022-03-01T20:46:11.467-06:00'
                        updated_at: '2022-03-01T20:46:11.467-06:00'
                      properties:
                        id:
                          type: integer
                        key:
                          type:
                          - string
                          - 'null'
                        description:
                          type:
                          - string
                          - 'null'
                        active:
                          type:
                          - boolean
                          - 'null'
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
