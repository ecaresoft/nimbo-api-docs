                      finished_at:
                        nullable: true
                      encounter_id:
                        type: integer
                      treatment_plan:
                        nullable: true
                      starts_at:
                        type: string
                        format: date-time
                      sis:
                        type: object
                      lab_test:
                        type: object
                      procedure:
                        nullable: true
                      encode_id:
                        type: string
                      consultation_attributes:
                        type: object
                      account_medical_instructions:
                        nullable: true
                      cirrus_prescription_status:
                        nullable: true
          description: Successful response
      operationId: legacy_nimbo_erp_get__consultations_consultation_id
      parameters:
      - name: consultation_id
        in: path
        required: true
        schema:
          type: string
  "/encounters/{encounter_id}/invoice":
    get:
      summary: GET /encounters/{encounter_id}/invoice
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice:
                    type: object
                    properties:
                      id:
                        type: integer
                      payment_type:
                        nullable: true
                      encounter_id:
                        type: integer
                      person_id:
                        type: integer
                      discount_rate:
                        nullable: true
                      discount_amount:
                        nullable: true
                      tax_rate:
                        nullable: true
                      tax_amount:
                        nullable: true
                      total_cents:
                        type: integer
                      total_discount_cents:
                        type: integer
                      total_tax_cents:
                        type: integer
                      links:
                        type: object
                        properties:
                          consultation:
                            type: string
                          consultation_invoice_items:
                            type: string
                          consultation_schedule:
                            type: string
                          encounter:
                            type: string
                      tax_attributes:
                        type: object
                      signed_at:
                        nullable: true
                      globally_invoiced:
                        type: boolean
                      cause:
                        type: string
                      starts_at:
                        type: string
                        format: date-time
          description: Successful response
      operationId: legacy_nimbo_erp_get__encounters_encounter_id_invoice
