          content:
            application/json:
              schema:
                type: object
                properties:
                  consultation:
                    type: object
                    properties:
                      id:
                        type: integer
                      cause:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      links:
                        type: object
                        properties:
                          person:
                            type: string
                          prescriptions:
                            type: string
                          encounter:
                            type: string
                          physical_test_samples:
                            type: string
                          consultation_diagnostics:
                            type: string
                          consultation_procedures:
                            type: string
                          consultation_lab_tests:
                            type: string
                          consultation_lab_test_result:
                            type: string
                          consultation_prescription_drugs:
                            type: string
                          consultation_schedule:
                            type: string
                          disability_leave:
                            type: string
                          invoice:
                            type: string
                          vital_signs_set:
                            type: string
                          odontogram:
                            type: string
                          medical_note:
                            type: string
                          physiotherapy_records:
                            type: string
                          medical_history_attachments:
                            type: string
                          location:
                            type: string
                          operating_room_requests:
                            type: string
                      medical_instructions:
                        type: string
                      physical_examination:
