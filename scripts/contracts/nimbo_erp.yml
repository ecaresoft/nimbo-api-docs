                        quantity:
                          type: integer
                        amount:
                          type: integer
                        value:
                          type: integer
                        account_id:
                          type: integer
                        invoice_item_id:
                          type: integer
                        invoice_id:
                          type: integer
                        invoice_item_sku:
                          nullable: true
                        accounting_type:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        tax_attributes:
                          type: object
                        kop_key:
                          nullable: true
                        kop_description:
                          nullable: true
                        uom_key:
                          nullable: true
                        uom_description:
                          nullable: true
          description: Successful response
      operationId: legacy_nimbo_erp_get__invoices_invoice_id_consultation_invoice_items
