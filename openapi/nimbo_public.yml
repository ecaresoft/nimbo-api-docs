---
openapi: 3.1.0
info:
  title: Nimbo catalogs and sites
  version: 0.1.0
  description: Nimbo API reference. Use the API host and integration access provided
    by Nimbo.
servers:
- url: https://api.example.test
  description: Reference only; not a live API host
tags:
- name: Countries
- name: Catalogs
- name: SAT Catalogs
- name: Sites
- name: Public Portals
- name: Telehealth
paths:
  "/api/v1/countries":
    get:
      tags:
      - Countries
      operationId: listCountries
      summary: List countries
      description: Lists active countries. Inactive countries are excluded.
      responses:
        '200':
          description: Active countries with the response root and state links.
          content:
            application/json:
              schema:
                type: object
                required:
                - countries
                additionalProperties: false
                properties:
                  countries:
                    type: array
                    items:
                      type: object
                      required:
                      - abbrv
                      - country_code
                      - default_locale
                      - default_vademecum
                      - id
                      - links
                      - name_en
                      - name_es
                      - nationality_en
                      - nationality_es
                      additionalProperties: false
                      properties:
                        id:
                          type: integer
                          example: 1
                        name_en:
                          type: string
                          example: Mexico
                        name_es:
                          type: string
                          example: Mexico
                        abbrv:
                          type: string
                          example: MX
                        links:
                          type: object
                          required:
                          - states
                          additionalProperties: false
                          properties:
                            states:
                              type: string
                              example: "/api/v1/countries/1/states"
                        country_code:
                          type:
                          - string
                          - 'null'
                          example: '52'
                        default_locale:
                          type:
                          - string
                          - 'null'
                          example: es
                        nationality_es:
                          type:
                          - string
                          - 'null'
                          example: Mexicana
                        nationality_en:
                          type:
                          - string
                          - 'null'
                          example: Mexican
                        default_vademecum:
                          type:
                          - boolean
                          - 'null'
                          example: true
              examples:
                countries:
                  value:
                    countries:
                    - id: 1
                      name_en: Mexico
                      name_es: Mexico
                      abbrv: MX
                      links:
                        states: "/api/v1/countries/1/states"
                      country_code: '52'
                      default_locale: es
                      nationality_es: Mexicana
                      nationality_en: Mexican
                      default_vademecum: MX
  "/api/v1/countries/{id}":
    get:
      tags:
      - Countries
      operationId: getCountry
      summary: Get a country
      description: Returns an active country. Inactive countries are treated as not
        found.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: '123'
      responses:
        '200':
          description: Country with the response root.
          content:
            application/json:
              schema:
                type: object
                required:
                - country
                additionalProperties: false
                properties:
                  country:
                    type: object
                    required:
                    - abbrv
                    - country_code
                    - default_locale
                    - default_vademecum
                    - id
                    - links
                    - name_en
                    - name_es
                    - nationality_en
                    - nationality_es
                    additionalProperties: false
                    properties:
                      id:
                        type: integer
                        example: 1
                      name_en:
                        type: string
                        example: Mexico
                      name_es:
                        type: string
                        example: Mexico
                      abbrv:
                        type: string
                        example: MX
                      links:
                        type: object
                        required:
                        - states
                        additionalProperties: false
                        properties:
                          states:
                            type: string
                            example: "/api/v1/countries/1/states"
                      country_code:
                        type:
                        - string
                        - 'null'
                        example: '52'
                      default_locale:
                        type:
                        - string
                        - 'null'
                        example: es
                      nationality_es:
                        type:
                        - string
                        - 'null'
                        example: Mexicana
                      nationality_en:
                        type:
                        - string
                        - 'null'
                        example: Mexican
                      default_vademecum:
                        type:
                        - boolean
                        - 'null'
                        example: true
        '404':
          description: The requested resource was not found or is outside the authorized
            patient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_found:
                  value:
                    error: Not found
  "/api/v1/countries/{id}/states":
    get:
      tags:
      - Countries
      operationId: listCountryStates
      summary: List states for a country
      description: Lists states for an active country in ascending ID order. Inactive
        countries are treated as not found.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: '123'
      responses:
        '200':
          description: States with the response root.
          content:
            application/json:
              schema:
                type: object
                required:
                - states
                additionalProperties: false
                properties:
                  states:
                    type: array
                    items:
                      type: object
                      required:
                      - abbrv
                      - id
                      - links
                      - name
                      additionalProperties: false
                      example:
                        id: 9001
                        name: Ciudad de Mexico
                        abbrv: CDMX
                        links:
                          country: "/api/v1/countries/484"
                          counties: "/api/v1/states/9001/counties"
                      properties:
                        id:
                          type: integer
                        name:
                          type:
                          - string
                          - 'null'
                        abbrv:
                          type:
                          - string
                          - 'null'
                        links:
                          type: object
                          required:
                          - country
                          - counties
                          additionalProperties: false
                          properties:
                            country:
                              type: string
                            counties:
                              type: string
        '404':
          description: The requested resource was not found or is outside the authorized
            patient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_found:
                  value:
                    error: Not found
