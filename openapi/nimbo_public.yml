                      id: 9001
                      name: Ciudad de Mexico
                      abbrv: CDMX
                      links:
                        country: "/api/v1/countries/484"
                        counties: "/api/v1/states/9001/counties"
                    properties:
                      id:
                        type: integer
                      name:
                        type:
                        - string
                        - 'null'
                      abbrv:
                        type:
                        - string
                        - 'null'
                      links:
