                    error: Not found
  "/api/v1/waiting_rooms/waiting_room_slug":
    get:
      tags:
      - Public Portals
      - Telehealth
      operationId: showWaitingRoomBySlug
      summary: Show a public waiting room by room or entry-point slug
      description: Resolves an active waiting room by its canonical slug or by an
        active entry-point slug. A canonical room match takes precedence. Entry-point
        links return entry_point metadata for the parent room. Pass entry_point.id
        when joining the queue to retain the origin of the visit. A canonical link
        returns entry_point as null. An unknown or inactive destination returns an
        empty HTTP 404.
      parameters:
      - name: slug
        in: query
        required: true
        schema:
          type: string
        example: demo-video-room
      responses:
        '200':
          description: Waiting-room configuration.
          content:
            application/json:
              schema:
                type: object
                required:
                - waiting_room
                additionalProperties: false
                properties:
                  waiting_room:
                    type: object
                    required:
                    - id
                    - organization_id
                    - name
                    - slug
                    - schedule_configuration
                    - waiting_room_configuration
                    - created_at
                    - updated_at
                    - selected_accounts
                    - custom_field_ids
                    - entry_point
                    - entry_points_count
                    additionalProperties: false
                    properties:
                      id:
                        type: integer
                        example: 901
                      organization_id:
                        type:
                        - integer
                        - 'null'
                        example: 123
                      name:
                        type:
                        - string
                        - 'null'
                      slug:
                        type:
                        - string
                        - 'null'
                      schedule_configuration:
                        type: object
                        additionalProperties: true
                      waiting_room_configuration:
                        type: object
                        additionalProperties: true
                      created_at:
                        type: string
                        example: '2026-01-01T06:00:00.000-06:00'
                      updated_at:
                        type: string
                        example: '2026-01-01T06:00:00.000-06:00'
                      selected_accounts:
                        type: array
                        items:
                          type: integer
                        example:
                        - 456
                      custom_field_ids:
                        description: Associated custom fields excluding soft-deleted
                          fields, in configured order. Field and join active flags
                          do not filter this list.
                        type: array
                        items:
                          type: integer
                        example: []
                      entry_point:
                        oneOf:
                        - type: object
                          additionalProperties: false
                          required:
                          - id
                          - waiting_room_id
                          - name
                          - slug
                          - active
                          - created_at
                          - updated_at
                          properties:
                            id:
                              type: integer
                              example: 902
                            waiting_room_id:
                              type: integer
                              example: 901
                            name:
                              type: string
                              example: Synthetic north entrance
                            slug:
                              type: string
                              example: demo-north-entrance
                            active:
                              type: boolean
                              example: true
                            created_at:
                              type: string
                              example: '2026-01-01T06:00:00.000-06:00'
                            updated_at:
                              type: string
                              example: '2026-01-01T06:00:00.000-06:00'
                        - type: 'null'
                      entry_points_count:
                        type: integer
                        minimum: 0
                        description: Total entries for this room, including inactive
                          entries.
                        example: 2
        '404':
          description: The slug is blank, missing, or identifies an inactive entry
            point or room. The response body is empty.
