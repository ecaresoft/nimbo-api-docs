      description: "### **Endpoint: Update Account Profile**\n\n#### **Descripción**\n\nPermite actualizar el perfil de una cuenta existente identificada por su\_`account_id`.\n\n---\n\n### **Solicitud**\n\n**Método:**\_`PUT`  \n**Endpoint:**\_`https://api-staging.nimbo.app/api/v1/account_profiles/{account_id}`\n\n#### **Cuerpo de la Solicitud (JSON)**\n\nDebe incluir el objeto\_`account_profile`\_con los siguientes parámetros:\n\n| Campo | Tipo | Descripción |\n| --- | --- | --- |\n| `certified_information` | boolean | Indica si la información está certificada. |\n| `physician_institution` | string | Nombre de la institución que otorgó las credenciales. |\n| `physician_license` | string | Número de licencia del médico. |\n| `role` | string | Rol del usuario (debe ser\_`\"medic\"`). |\n| `office_state_id` | string | ID del estado de la consulta (obtenido del endpoint\_`states`). |\n| `physician_specialty_id` | string | ID de la especialidad médica (obtenido del endpoint\_`specialties`). |\n\n**Nota:**\n\n- Reemplazar\_`{account_id}`\_en el endpoint con el ID real de la cuenta.\n    \n\n---\n\n### **Respuesta Exitosa**"
