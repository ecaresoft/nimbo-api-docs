        - BearerAuth: []
  /invoice_items/invoice_items_payment:
    get:
      summary: /invoice_items/invoice_items_payment
      responses:
        '200':
          description: OK
      tags:
        - Charges
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
  /invoices:
    post:
      summary: /invoices
      responses:
        '200':
          description: OK
      tags:
        - Charges
      security:
        - BearerAuth: []
      description: >-
        1. **encounter_id:** Id del encuentro del paciente, se puede obtener del
        end point de consulta de pacientes y sus encuentros:
        /reports/consultation_invoice_items
            
        2. **tax_attributes:**
            
            1. **use_cfdi:** Clave del cfdi incluido en el catalogo del sat. Ejemplo: "S01"
                
            2. **payment_method:** Solo soporta el tipo de pago: "PUE"
                
            3. **payment_form:** Se envia por default: "01" . Puede ser actualizado al modificar seleccionando cualquier forma de pago incluido en el catalogo de formas de pago /invoice_items/invoice_items_payment
                
        3. **consultation_id**: Id de la consulta relacionada al encuentro,
        enviar como **null**
            
        4. **person_id:** Id del paciente
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                invoice:
                  type: object
                  properties:
                    encounter_id:
                      type: string
                    tax_attributes:
                      type: object
                      properties:
                        use_cfdi:
                          type: string
                        payment_method:
                          type: string
                        payment_form:
                          type: string
                          format: utc-millisec
                    consultation_id:
                      nullable: true
                    person_id:
                      type: string
            example:
              invoice:
                encounter_id: '{{encounter_id}}'
                tax_attributes:
                  use_cfdi: '{{use_cfdi}}'
                  payment_method: PUE
                  payment_form: '01'
                consultation_id: null
                person_id: '{{person_id}}'
  /consultation_invoice_items:
    post:
      summary: /consultation_invoice_items
      responses:
        '200':
          description: OK
      tags:
        - Charges
      security:
        - BearerAuth: []
      description: >-
        1. **quantity**: Cantidad de productos
            
        2. **value**: Precio del producto expresado en centavos. Ejemplo para
        650.00: 65000  
            (Debe coincidir con el id del producto enviado en el campo invoice_item_id)
            
        3. **description**: Descripción del producto (Debe coincidir con el id
        del producto enviado en el campo invoice_item_id)
            
        4. **accounting_type**: Tipo de cargo, puede tener como valores "charge"
        o "payment", para este caso se utiliza "charge"
            
        5. **account_id**: Id del usuario que registra el cargo (Asistente o
        médico)
            
        6. **invoice_id**: Id de la factura (Documento creado en el paso 1)
            
        7. **invoice_item_id**: Id del producto que se va a agregar como cargo.
        ( Puedes consultarlo del endpoint de búsqueda de productos:
        [/invoice_item_locations](https://www.postman.com/nimbo-x/nimbo-apis-public-documentation/request/j30orbv/invoice-item-locations?action=share&source=copy-link&creator=3228734&ctx=documentation)
        )
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                consultation_invoice_item:
                  type: object
                  properties:
                    quantity:
                      type: string
                    value:
                      type: string
                    description:
                      type: string
                    accounting_type:
                      type: string
                    account_id:
                      type: string
                    invoice_id:
                      type: string
                    invoice_item_id:
                      type: string
            example:
              consultation_invoice_item:
                quantity: '{{quantity}}'
                value: '{{value}}'
                description: '{{description}}'
                accounting_type: '{{accounting_type}}'
                account_id: '{{account_id}}'
                invoice_id: '{{invoice_id}}'
                invoice_item_id: '{{invoice_item_id}}'
