  /reports/consultation_invoice_items:
    get:
      summary: /reports/consultarion_invoice_items
      parameters:
        - name: start
          in: query
          description: Fecha inicio (aaaa-mm-dd)
          schema:
            type: string
          example: ''
        - name: end
          in: query
          description: Fecha fin (aaaa-mm-dd)
          schema:
            type: string
          example: ''
        - name: person
          in: query
          description: Id paciente
          schema:
            type: string
          example: ''
      responses:
        '200':
          description: OK
      tags:
        - Charges
      security:
        - BearerAuth: []
      description: >-
        1. **start:** Fecha de inicio donde comenzará la búsqueda de encuentros
        existentes para el paciente. Formato: aaaa-mm-dd
            
        2. **end:** Fecha de fin donde terminará la búsqueda de encuentros
        existentes para el paciente. Formato: aaaa-mm-dd
            
        3. **person:** Id del paciente del que se desean consultar los cargos
