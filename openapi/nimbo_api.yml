openapi: 3.0.0
info:
  title: Nimbo API
  version: 1.0.0
  description: >-
    # La solución todo-en-uno para clínicas.


    Nimbo te da todo lo que necesitas para administrar tu clínica.


    Desde el manejo de expedientes clínicos, hasta la agenda médica, facturación
    y reputación digital. Comienza a automatizar la operación de tu clínica hoy
    mismo.


    Para empezar a usar el API de Nimbo crea una cuenta en nuestro ambiente de
    Staging.  

    [https://nimbo-x-staging.firebaseapp.com/accounts/new](https://nimbo-x-staging.firebaseapp.com/accounts/new)


    Una vez concluido el registro, con el usuario y contraseña que usaste podrás
    autenticarte en el API.


    No utilices datos reales en este ambiente de pruebas. La información
    registrada podría ser visible a los miembros del equipo de desarrollo de
    Nimbo.
servers:
  - url: '{{nimbo_url}}'
  - url: https://nimbox-api-staging.herokuapp.com
paths:
  /custom_fields:
    get:
      summary: Get Person Custom Fields
      parameters:
        - name: applicable_model
          in: query
          schema:
            type: string
          example: Person
        - name: page
          in: query
          schema:
            type: integer
          example: 1
        - name: query
          in: query
          schema:
            type: string
          example: ''
      responses:
        '200':
          description: OK
      tags:
        - Patient Management
        - CustomFields
    post:
      summary: Create field - ConsultationSurvey
      responses:
        '200':
          description: OK
      tags:
        - Patient Management
        - CustomFields
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                custom_field:
                  type: object
                  properties:
                    key:
                      nullable: true
                    name:
                      type: string
                    section_name:
                      type: string
                    default_options:
                      type: object
                    default_component:
                      type: string
                    applicable_model:
                      type: string
                    organization_id:
                      nullable: true
            example:
              custom_field:
                key: null
                name: Color de Ojos3
                section_name: consultation_survey
                default_options: {}
                default_component: html-input
                applicable_model: ConsultationSurvey
                organization_id: null
