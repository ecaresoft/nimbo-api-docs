  /invitations:
    post:
      summary: invitations
      responses:
        '200':
          description: OK
      tags:
        - Account Management
      security:
        - BearerAuth: []
      description: "## **Endpoint de API para Invitaciones**\n\n### **Descripción**\n\nEste endpoint es fundamental para gestionar invitaciones de usuarios, permitiendo que nuevos miembros se unan a la organización con los permisos y roles adecuados.\n\nAl utilizarlo, se envía un correo electrónico al destinatario con las instrucciones para activar su cuenta.\n\n---\n\n### **Solicitud**\n\n#### **Método**:\_`POST`\n\n#### **URL**:\_`https://api-staging.nimbo.app/api/v1/invitations`\n\n#### **Encabezados**:\n\n- `Content-Type`:\_`application/json`\n    \n\n#### **Cuerpo de la solicitud (JSON)**\n\nDebe incluir los siguientes campos:\n\n| Campo | Tipo | Requerido | Descripción |\n| --- | --- | --- | --- |\n| `recipient_email` | string | Sí | Correo electrónico del destinatario (debe ser único en la aplicación). |\n| `recipient_password` | string | Sí | Contraseña temporal (mínimo 8 caracteres). |\n| `recipient_name` | string | Sí | Nombre completo del destinatario. |\n| `invitation_for` | string | Sí | Rol asignado (ej.\_`\"medic\"`). |\n| `assistant_patient_access` | boolean | No | Permite acceso a información de pacientes (por defecto\_`false`). |\n| `configuration` | object | Sí | Configuración de permisos (detallada abajo). |\n| `create_user` | boolean | Sí | Debe ser\_`true`\_para crear la cuenta. |\n| `organization_id` | string | Sí | ID de la organización (obtenido del endpoint\_`Current Organization`). |\n| `location_id` | string | Sí | ID de la ubicación (obtenido del endpoint\_`locations`). |\n| `physician_specialty_id` | string | Sí | ID de la especialidad médica (obtenido del endpoint\_`Specialties`). |\n\n#### **Estructura de**\_**`configuration`**\n\njson\n\n```\n{\n  \"access_to_clinical\": false,\n  \"access_to_charges\": false,\n  \"custom_roles\": {\n    \"administrator\": false,\n    \"restricted_medic\": false,\n    \"all_agendas\": false,\n    \"access_control\": false\n  }\n}\n\n ```\n\n- **Nota para médicos**: Todos los valores en\_`custom_roles`\_deben ser\_`false`.\n    \n\n---\n\n### **Respuesta Exitosa**\n\n- **Código de estado**:\_`201 (Created)`\n    \n- **Cuerpo de la respuesta (JSON)**:\n    \n\n## Response\n\nCuando la invitación se crea correctamente, la API devuelve:\n\n- **Código de estado**:\_`201 (Created)`\n    \n- **Cuerpo de la respuesta (JSON)**:\n    \n- **`invitation`**\_(objeto): Contiene los detalles de la invitación.\n    \n    - **`token`**\_(string): Token único vinculado a la invitación.\_**Debe almacenarse**, ya que es necesario para confirmar la cuenta.\n        \n\n### Example\n\n``` json\n{\n  \"invitation\": {\n    \"recipient_email\": \"string\",          // Email address of the recipient\n    \"recipient_password\": \"string\",       // Password for the recipient's account\n    \"recipient_name\": \"string\",           // Full name of the recipient\n    \"invitation_for\": \"string\",           // Type of invitation (e.g., \"member\")\n    \"assistant_patient_access\": \"boolean\", // Access level for assistant to patient data\n    \"configuration\": {\n      \"access_to_clinical\": \"boolean\",    // Access to clinical information\n      \"access_to_charges\": \"boolean\",      // Access to charge information\n      \"custom_roles\": {\n        \"administrator\": \"boolean\",         // Role assignment for administrator\n        \"restricted_medic\": \"boolean\",     // Role assignment for restricted medic\n        \"all_agendas\": \"boolean\",           // Access to all agendas\n        \"access_control\": \"boolean\"         // General access control permission\n      }\n    },\n    \"create_user\": \"boolean\",              // Flag to indicate if a user should be created\n    \"organization_id\": \"string\",           // ID of the organization\n    \"location_id\": \"string\",                // ID of the location\n    \"physician_specialty_id\": \"string\"     // ID of the physician specialty\n  }\n}\n\n ```"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                invitation:
                  type: object
                  properties:
                    recipient_email:
                      type: string
                      format: email
                    recipient_password:
                      type: string
                    recipient_name:
                      type: string
                    invitation_for:
                      type: string
                    assistant_patient_access:
                      type: boolean
                    send_email:
                      type: boolean
                    configuration:
                      type: object
                      properties:
                        access_to_clinical:
                          type: boolean
                        access_to_charges:
                          type: boolean
                        custom_roles:
                          type: object
                          properties:
                            administrator:
                              type: boolean
                            restricted_medic:
                              type: boolean
                            all_agendas:
                              type: boolean
                            access_control:
                              type: boolean
                    create_user:
                      type: boolean
                    organization_id:
                      type: string
                      format: utc-millisec
                    location_id:
                      type: string
                      format: utc-millisec
                    physician_specialty_id:
                      type: string
                      format: utc-millisec
            example:
              invitation:
                recipient_email: medic.psic.02@yopmal.com
                recipient_password: password123
                recipient_name: Eduardo Landa
                invitation_for: member
                assistant_patient_access: false
                send_email: true
                configuration:
                  access_to_clinical: false
                  access_to_charges: false
                  custom_roles:
                    administrator: true
                    restricted_medic: true
                    all_agendas: true
                    access_control: false
                create_user: true
                organization_id: '16736'
                location_id: '17611'
                physician_specialty_id: '84'
  /accounts/set_password:
    post:
      summary: accounts/set_password
      responses:
        '200':
          description: OK
      tags:
        - Account Management
      security:
        - BearerAuth: []
      description: >-
        ### **Endpoint para Configuración de Contraseña**


        #### **Descripción**


        Este endpoint permite a los usuarios **establecer** o **actualizar** la
        contraseña de su cuenta. Requiere el correo electrónico del usuario, la
        nueva contraseña y su confirmación.


        ---


        ### **Solicitud**


        #### **Método**: `POST`


        #### **URL**:
        `https://api-staging.nimbo.app/api/v1/accounts/set_password`


        #### **Campos Requeridos (JSON)**:


        | Campo | Tipo | Descripción |

        | --- | --- | --- |

        | `email` | string | Correo electrónico asociado a la cuenta. |

        | `password` | string | Nueva contraseña. |

        | `password_confirmation` | string | Confirmación de la nueva contraseña
        (debe coincidir con `password`). |


        **Nota**:


        - La contraseña y su confirmación deben ser idénticas para evitar
        errores.
            

        ---


        ### **Respuesta Exitosa**


        - **Código de estado**: `200 (OK)`
            

        ### **Posibles Errores**


        - `422 (Unprocessable Entity)`: Si los campos son inválidos o las
        contraseñas no coinciden.
            

        ---


        ### **Ejemplo de Solicitud**


        json


        ```

        {
          "email": "usuario@ejemplo.com",
          "password": "nueva_contraseña_segura",
          "password_confirmation": "nueva_contraseña_segura"
        }

         ```
