  /people:
    post:
      summary: /people
      responses:
        '201':
          description: /people
          headers:
            Server:
              schema:
                type: string
              example: Cowboy
            Date:
              schema:
                type: string
              example: Sat, 06 Mar 2021 00:22:09 GMT
            Connection:
              schema:
                type: string
              example: keep-alive
            X-Frame-Options:
              schema:
                type: string
              example: SAMEORIGIN
            X-Xss-Protection:
              schema:
                type: string
              example: 1; mode=block
            X-Content-Type-Options:
              schema:
                type: string
              example: nosniff
            Etag:
              schema:
                type: string
              example: W/"d6befbfbd2695e3bf81370a595867759"
            Cache-Control:
              schema:
                type: string
              example: max-age=0, private, must-revalidate
            X-Request-Id:
              schema:
                type: string
              example: f15ac5ec-7281-4f36-bc19-143428ab1d65
            X-Runtime:
              schema:
                type: number
              example: 1.115339
            Transfer-Encoding:
              schema:
                type: string
              example: chunked
            Via:
              schema:
                type: string
              example: 1.1 vegur
          content:
            application/json:
              schema:
                type: object
                properties:
                  person:
                    type: object
                    properties:
                      id:
                        type: integer
                      first_name:
                        type: string
                      last_name:
                        type: string
                      links:
                        type: object
                        properties:
                          consultations:
                            type: string
                          consultation_lab_test_results:
                            type: string
                          consultation_schedules:
                            type: string
                          vital_signs_sets:
                            type: string
                          medical_history:
                            type: string
                          deffers:
                            type: string
                          medical_notes:
                            type: string
                          insurance_coverage:
                            type: string
                      full_name:
                        type: string
                      telephone:
                        nullable: true
                      email:
                        nullable: true
                      born_at:
                        type: string
                        format: date
                      gender:
                        type: string
                      avatar_url_small:
                        type: string
                      avatar_url_medium:
                        type: string
                      telephone2:
                        type: string
                        format: utc-millisec
                      address_state_id:
                        type: integer
                      address_city:
                        nullable: true
                      address_street:
                        nullable: true
                      address_zipcode:
                        nullable: true
                      identity_number:
                        nullable: true
                      account_id:
                        type: integer
                      avatar_url_large:
                        type: string
                      notes:
                        nullable: true
                      person_attributes:
                        type: object
                      phone_country_id:
                        type: integer
                      is_migrated:
                        type: boolean
                      without_cellphone:
                        type: boolean
                      nimbochat_invitation_sent:
                        type: boolean
                      medical_record:
                        nullable: true
              example:
                person:
                  id: 661485
                  first_name: Gonzalo
                  last_name: Gonzalez
                  links:
                    consultations: /api/v1/people/661485/consultations
                    consultation_lab_test_results: /api/v1/people/661485/consultation_lab_test_results
                    consultation_schedules: /api/v1/people/661485/consultation_schedules
                    vital_signs_sets: /api/v1/people/661485/vital_signs_sets
                    medical_history: /api/v1/people/661485/medical_history
                    deffers: /api/v1/people/661485/deffers
                    medical_notes: /api/v1/people/661485/medical_notes
                    insurance_coverage: /api/v1/people/661485/insurance_coverage
                  full_name: Gonzalo Gonzalez
                  telephone: null
                  email: null
                  born_at: '1995-01-01'
                  gender: m
                  avatar_url_small: ''
                  avatar_url_medium: ''
                  telephone2: '9292929292'
                  address_state_id: 7
                  address_city: null
                  address_street: null
                  address_zipcode: null
                  identity_number: null
                  account_id: 16036
                  avatar_url_large: ''
                  notes: null
                  person_attributes: {}
                  phone_country_id: 142
                  is_migrated: false
                  without_cellphone: false
                  nimbochat_invitation_sent: false
                  medical_record: null
      tags:
        - Patient Management
      security:
        - BearerAuth: []
      description: >-
        1. **first_name:** Nombre del paciente, obligatorio
            
        2. **last_name:** Apellido del paciente, obligatorio
            
        3. **born_at**: Utilizar el formato "aaa-mm-dd"
            
        4. **gender**: puedes utilizar los valores "f", "m" u "o" (f= fenemino,
        m=masculino y o= Otro)
            
        5. **telephone2**: Celular del paciente
            
            1. Los dígitos deben coincidir con el código del país agregado en **phone_country_id.**
                
            2. El campo es obligatorio u opcional, está condicionado al campo "without_cellphone":
                
                1. without_cellphone = false, entonces telephone2; obligatorio
                    
                2. without_cellphone = true, entonces telephone2; opcional
                    
        6. **email**: Campo obligatorio u opcional, condicionado al campo
        "send_welcome_email"
            
            1. send_welcome_email= true, por lo tanto email: obligatorio
                
            2. send_welcome_email= false, por lo tanto email: opcional
                
        7. **notes**: Opcional, puede ir vacío. Notas medicas del paciente
            
        8. **send_welcome_email:** Valores "true" o "false". Define si el campo
        email es obligatorio
            
        9. **Person attributes**
            
            1. "send_reminders": Valores "true" o "false". Define si el paciente acepta recibir notificaciones por whatsApp
                
            2. "identity_number": Opcional, curp del paciente
                
        10. **without_cellphone**: Obligatorio, valores: "true" o "false".
        Define si el campo email es obligatorio
            
        11. **patient_group_ids**: Opcional, arreglo con el id de los grupos al
        que el paciente pertenece. Se obtiene del catálogo de grupos de
        pacientes.  
            (Catalogo mencionado en prerequisistos)
            
        12. **account_id**: ID del médico tratante, obtenido del catálogo de
        médicos. Define si el campo email es obligatorio (Catalogo mencionado en
        prerrequisistos)
            
        13. **address_state_id**: ID del estado de la dirección del paciente,
        obtenido del catálogo de estados (Catalogo mencionado en
        prerrequisistos)
            
        14. **phone_country_id**: Código del país al que pertenece el numero
        celular agregado en el campo **phone_country_id** (Ejemplo para agregar
        número de México: "142")
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                person:
                  type: object
                  properties:
                    first_name:
                      type: string
                    last_name:
                      type: string
                    born_at:
                      type: string
                    gender:
                      type: string
                    phone_country_id:
                      type: string
                    telephone2:
                      type: string
                    email:
                      type: string
                    account_id:
                      type: string
            example:
              person:
                first_name: '{{first_name}}'
                last_name: '{{last_name}}'
                born_at: '{{born_at}}'
                gender: '{{gender}}'
                phone_country_id: '{{phone_country}}'
                telephone2: '{{telephone2}}'
                email: '{{email}}'
                account_id: '{{account_id}}'
