  /accounts/{account_id}:
    put:
      summary: accounts
      responses:
        '200':
          description: OK
      tags:
        - Account Management
      security:
        - BearerAuth: []
      description: "## Update Account Information\n\nPermite actualizar la información de configuración de una cuenta específica identificada por su ID único.\n\n### Request Parameters\n\nEl cuerpo de la solicitud debe estructurarse de la siguiente manera:\n\n- `account`: An object containing the account details.\n    \n    - `account_setup_completed` (boolean): Inidica que la configuración de la cuenta ha sido completada, debe ser: _**true**_\n        \n    - `configuration`: Objeto que contiene los parámetros de configuración de la cuenta.\n        \n        - `locale`\_(string): Idioma de la cuenta (ej. \"es-mx\")\n            \n        - `schedule`: Objeto que define el horario semanal\n            \n            - `mon`,\_`tue`,\_`wed`,\_`thu`,\_`fri`,\_`sat`,\_`sun`: Horarios disponibles de consulta para cada día\n                \n        - `weeks_limit`: Objeto que define límites de consultas\n            \n            - `id`\_(integer): 1 = sin límite\n                \n            - `time`\_(integer): 0 = sin límite de tiempo\n                \n            - `interval`\_(string): Dejar vacío para ningún período de intervalo\n                \n        - `consultation_duration`\_(integer): Duración de consultas en minutos (afecta la hora de finalización)\n            \n        - `timezone`\_(string): Zona horaria (ej. \"America/Mexico_City\")\n            \n        - `consultation`: Configuración de consultas (usar valores por defecto)\n            \n            - `odontogram`\_(boolean): Incluir odontograma\n                \n            - `physical_exam`\_(boolean): Incluir examen físico\n                \n            - `treatment_plan`\_(boolean): Incluir planes de tratamiento\n                \n        - `custom_forms`: Configuración de formularios\n            \n            - `consultation`: Elementos para formularios de consulta\n                \n                - `vital_signs_elements`: Parámetros de signos vitales (valores por defecto)\n                    \n                - `lab_test_results_elements`: Parámetros de resultados de laboratorio (valores por defecto)\n                    \n            - `medical_history`: Elementos de historial médico (valores por defecto)\n                \n        - `custom_roles`: Configuración de roles\n            \n            - `all_agendas`\_(boolean): Permiso para ver agendas de otros médicos (false)\n                \n            - `administrator`\_(boolean): Permisos de administrador (false)\n                \n            - `restricted_medic`\_(boolean): Restringe prescripciones en consultas (false)\n                \n        - `weekly_email`\_(boolean): Habilitar correos semanales\n            \n        - `prescription_copy`\_(boolean): Copias de recetas\n            \n        - `interface_language`\_(string): Idioma de interfaz (\"es\")\n            \n        - `prescription_template`\_(string): Plantilla de recetas (\"basic\"|\"clasic\"|\"modern\"|\"blank\")\n            \n        - `assistant_has_charges_access`\_(boolean): Acceso a cargos (false)\n            \n        - `assistant_has_clinical_access`\_(boolean): Acceso clínico (false)\n            \n        - `print_vital_signs`\_(boolean): Imprimir signos vitales\n            \n        - `print_diagnostics`\_(boolean): Imprimir diagnósticos\n            \n        - `email`\_(string): Correo electrónico\n            \n        - `eprescription_enabled`\_(boolean): Recetas electrónicas\n            \n        - `name`\_(string): Nombre del titular\n            \n        - `pending_confirmation_email`\_(string): Correo pendiente de confirmación\n            \n        - `physician_institution`\_(string): Institución del médico\n            \n        - `physician_license`\_(string): Número de licencia\n            \n        - `username`\_(string): Nombre de usuario\n            \n        - `cellphone`\_(string): Teléfono (con\_`cellphone_country_id`)\n            \n        - `organization_id`\_(integer): ID de organización\n            \n        - `active`\_(boolean): Cuenta activa\n            \n        - `bio`\_(string): Biografía\n            \n        - `office_state_id`\_(string): ID de estado\n            \n        - `physician_specialty_id`\_(integer): ID de especialidad\n            \n        - `cellphone_country_id`\_(integer): ID de país del teléfono\n            \n\n## Respuesta Esperada\n\nAnte una actualización exitosa, la API devolverá un código de estado 200 junto con un objeto JSON que contiene la información actualizada de la cuenta."
      requestBody:
        content:
          application/json:
            schema:
              type: object
