  "/api/v1/patient_portal/consultations/{id}/vital_signs_history":
    get:
      tags:
      - Patient Portal
      operationId: listPatientPortalConsultationVitalSignsHistory
      summary: List the separate vital-sign captures for an authorized visit
      description: Uses the consultation ID used by the patient application's visit
        page. An encounter is the parent of at most one consultation; a consultation
        may have multiple captures. Returns only that consultation's non-deleted captures
        whose person_id matches the authorized patient. Uses exactly the same capture
        schema, dynamic measurement selection and pagination as patient history, ordered
        by recorded_at descending (missing dates last), then ID descending. Requires
        an authorized non-deleted patient, a non-deleted consultation and share_medical_history
        exactly true in the patient's organization. Store-review sessions retain their
        configured patient restrictions. A visit without captures returns an empty
        collection. Independent of the existing consultation detail's merged vital_signs_set.
        No writes, audit events or provider calls occur.
      security:
      - PatientPortalToken: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: '123'
      - name: page
        in: query
        description: Nonpositive or nonnumeric input defaults to 1; values above the
          maximum are clamped.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 1
        example: 1
      - name: per_page
        in: query
        description: Nonpositive or nonnumeric input defaults to 20; values above
          50 are clamped to 50.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        example: 20
      responses:
        '200':
          description: Separate saved captures. Empty history and out-of-range pages
            return an empty array; total_pages is zero only when no eligible captures
            match. Field labels and units come from saved content, without consulting
            today's field configuration.
          content:
            application/json:
              schema:
                type: object
                required:
                - vital_signs_history
                - meta
                additionalProperties: false
                properties:
                  vital_signs_history:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - consultation_id
                      - encounter_id
                      - encounter
                      - recorded_at
                      - updated_at
                      - set_type
                      - clinician
                      - measurements
                      additionalProperties: false
                      properties:
                        id:
                          type: integer
                          description: Stable saved-capture identity; multiple captures
                            can belong to the same encounter.
                        consultation_id:
                          type:
                          - integer
                          - 'null'
                          description: Linked kept consultation owned by the selected
                            patient; null when absent or inaccessible.
                        encounter_id:
                          type:
                          - integer
                          - 'null'
                          description: Parent encounter ID, distinct from consultation_id;
                            null when absent, deleted or inaccessible.
                        encounter:
                          oneOf:
                          - type: object
                            required:
                            - id
                            - starts_at
                            - cause
                            additionalProperties: false
                            properties:
                              id:
                                type: integer
                              starts_at:
                                type:
                                - string
                                - 'null'
                                format: date-time
                              cause:
                                type:
                                - string
                                - 'null'
                                description: Encounter heading; private consultation
                                  causes are masked with the existing portal placeholder.
                          - type: 'null'
                        recorded_at:
                          allOf:
                          - type:
                            - string
                            - 'null'
                            format: date-time
                          description: Stored capture created_at, possibly supplied
                            during creation; not an independently recorded measurement
                            time.
                        updated_at:
                          allOf:
                          - type:
                            - string
                            - 'null'
                            format: date-time
                          description: Latest saved modification; previous overwritten
                            values are not reconstructed.
                        set_type:
                          type:
                          - string
                          - 'null'
                          description: Original capture grouping, without restricting
                            history to a fixed vital-sign list.
                        clinician:
                          oneOf:
                          - type: object
                            required:
                            - id
                            - name
                            additionalProperties: false
                            description: Account attributed to the capture; not proof
                              of who performed or entered the measurement.
                            properties:
                              id:
                                type: integer
                              name:
                                type:
                                - string
                                - 'null'
                          - type: 'null'
                        measurements:
                          type: array
                          minItems: 1
                          description: Populated scalar measurements in this capture,
                            with no carry-forward from other captures. Includes custom
                            fields regardless of current activation. Nulls, whitespace-only
                            strings, objects, arrays and unfilled definitions are
                            omitted; zero and false are preserved. Current canonical
                            elements override the newest same-organization custom-form
                            snapshot for each key, including explicit clears. A snapshot
                            supplies missing keys only when its updated_at is at least
                            the capture's updated_at and both timestamps are known,
                            so older snapshots cannot restore values omitted on edits.
                            Whitespace means the explicit Unicode White_Space code-point
                            set, independent of database locale. Measurement order
                            is not significant.
                          items:
                            type: object
                            required:
                            - key
                            - value
                            - units
                            - label
                            - custom
                            additionalProperties: false
                            properties:
                              key:
                                type: string
                                description: Original field key; do not identify measurements
                                  by label alone.
                              value:
                                type:
                                - string
                                - number
                                - boolean
                                description: Original stored scalar value, without
                                  coercion or unit conversion.
                              units:
                                type:
                                - string
                                - 'null'
                                description: First populated saved string from units
                                  or unit; null when neither is valid, with no current-catalog
                                  substitution.
                              label:
                                type:
                                - string
                                - 'null'
                                description: Saved label when available; clients can
                                  localize standard keys or show the original key
                                  as a fallback.
                              custom:
                                type: boolean
                                description: Saved custom flag, or true for a measurement
                                  supplied only by the custom-form response.
                  meta:
                    type: object
                    required:
                    - page
                    - per_page
                    - total_pages
                    additionalProperties: false
                    properties:
                      page:
                        type: integer
                        minimum: 1
                      per_page:
                        type: integer
                        minimum: 1
                        maximum: 50
                      total_pages:
                        type: integer
                        minimum: 0
              example:
                vital_signs_history: []
                meta:
                  page: 1
                  per_page: 20
                  total_pages: 0
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        '403':
          description: The patient's organization has not explicitly enabled clinical-data
            sharing.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_shared:
                  value:
                    error: Clinical data is not shared
        '404':
          description: The requested resource was not found or is outside the authorized
            patient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_found:
                  value:
                    error: Not found
components:
  securitySchemes:
    LegacyStaffToken:
      type: http
      scheme: bearer
      description: 'Existing opaque staff OAuth token issued by the API. Protected
        staff operations also require the current organization''s owner to have a
        verified cellphone, before endpoint-specific role, product or tenant checks.
        The actor''s own verification and unrelated affiliations do not substitute.
        Explicit recovery exemptions are own-account/profile reads, current organization/subscription
        and subscription-plan reads, feature-toggle listing, current-location reads
        and location listing without a permitted scalar query or page. Location search/pagination
        remains protected. Patient-token and public endpoints do not acquire this
        staff gate.

        '
    LegacyStaffAccessTokenQuery:
      type: apiKey
      in: query
      name: access_token
      description: staff token alias; Bearer header takes precedence.
    LegacyStaffBearerTokenQuery:
      type: apiKey
      in: query
      name: bearer_token
      description: staff token alias; Bearer header and access_token take precedence.
    PatientPortalToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Patient portal JWT accepted either as a raw Authorization header
        value or as a Bearer token for client compatibility.

        '
tags:
- name: Patient Portal
- name: Patient portal authentication
