      summary: List organization portals available to an authorized patient
      description: Lists eligible personal, organization-schedule and telehealth waiting-room
        booking links, in that order. The personal link uses the patient's selected
        physician account, not all historical consultation physicians. Availability
        depends on the organization subscription and each portal's own scheduling,
        patient visibility and non-empty slug settings. A default schedule is not
        required. Organization schedules and waiting rooms are ordered by ID; appointment
        history does not determine eligibility.
      security:
