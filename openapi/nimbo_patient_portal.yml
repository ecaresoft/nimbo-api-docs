                      - consultation_id
                      - person_id
                      - account_id
                      - elements
                      - created_at
                      - updated_at
                      - deleted_at
                      - set_type
                      - metadata
                      additionalProperties: false
                      properties:
                        id:
                          type: integer
                        consultation_id:
                          type:
                          - integer
                          - 'null'
                        person_id:
                          type: integer
                        account_id:
                          type:
                          - integer
                          - 'null'
                        elements:
                          type: object
                          additionalProperties: true
                        created_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        updated_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        deleted_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        set_type:
                          type:
                          - string
                          - 'null'
                        metadata:
                          type: object
                          additionalProperties: true
                - type: 'null'
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
