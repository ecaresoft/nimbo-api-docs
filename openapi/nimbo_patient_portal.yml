  "/api/v1/patient_portal/people/{person_id}/consultation_schedules":
    get:
      tags:
      - Patient Portal
      operationId: listPatientPortalPersonConsultationSchedules
      summary: List authorized patient consultation schedules
      description: 'Pagination defaults to page 1 and per_page 10. Values above 100
        are accepted and clamped to 100 before limit, offset and total_pages; nonpositive
        or nonnumeric page sizes use 10. Resolves the patient through the authenticated
        patient token. Without scope=history (including unknown scope values), the
        existing response is unchanged: kept schedules starting at Time.zone.yesterday
        in the application timezone, ascending starts_at/id, or descending for state=unstarted.
        Only scope=history adds the lifecycle fields and returns all past and future
        kept schedules plus deleted rows explicitly marked cancellation_request_accepted,
        ordered starts_at DESC, id DESC. Generic deletions remain hidden; this does
        not reconstruct every staff cancellation. History state=unstarted excludes
        only schedules with an authorized kept consultation through an owned, kept
        encounter. Accepted cancellations with no linked consultation remain in history
        when state=unstarted; default unstarted behavior remains unchanged. History
        consultation status is started whenever a linked consultation exists (use
        consultation_finished_at for completion), otherwise cancelled for accepted
        cancellation, arrived for check-in, then the existing cancellation/confirmation/scheduled
        presentation. Explicit cancellation, arrival and missed evidence remains independent;
        no missing consultation or elapsed timestamp implies a no-show. History never
        offers confirm/cancel for canceled, missed, checked-in or started rows; remaining
        action eligibility retains existing notice, organization and payment restrictions.
        Clinical detail uses consultation_id, never the schedule or encounter ID.
        Historical pages can be loaded independently of the existing upcoming list.
        No writes or provider delivery occur.'
      security:
      - PatientPortalToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: integer
        example: 123
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: per_page
        in: query
        required: false
        description: Requested page size; values above 100 are accepted and clamped
          to 100 before limit, offset and total_pages calculations. Nonpositive handling
          is operation-specific.
        schema:
          type: integer
          minimum: 1
          default: 10
        example: 10
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum:
          - unstarted
        example: unstarted
      - name: scope
        in: query
        required: false
        description: The exact value history opts into complete schedules and lifecycle
          fields. Omitted and all other values preserve the existing response.
        schema:
          type: string
        example: history
      responses:
        '200':
          description: Existing recent schedules, or the extended complete history
            projection only when scope=history is requested.
          content:
            application/json:
              schema:
                type: object
                required:
                - consultation_schedules
                - meta
                additionalProperties: false
                properties:
                  consultation_schedules:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        required:
                        - id
                        - cause
                        - starts_at
                        - ends_at
                        - doctor_name
                        - doctor_image
                        - organization_name
                        - patient_name
                        - schedule_type
                        - status
                        - can_confirm_schedule
                        - can_cancel_schedule
                        - doctor_speciality
                        - doctor_speciality_es
                        - doctor_speciality_en
                        additionalProperties: false
                        properties:
                          id:
                            type: integer
                          cause:
                            type:
                            - string
                            - 'null'
                          starts_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          ends_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          doctor_name:
                            type:
                            - string
                            - 'null'
                          doctor_image:
                            type: string
                          organization_name:
                            type:
                            - string
                            - 'null'
                          patient_name:
                            type: string
                          schedule_type:
                            type:
                            - string
                            - 'null'
                          status:
                            type:
                            - string
                            - 'null'
                          can_confirm_schedule:
                            type: boolean
                          can_cancel_schedule:
                            type: boolean
                          doctor_speciality:
                            type:
                            - string
                            - 'null'
                          doctor_speciality_es:
                            type:
                            - string
                            - 'null'
                          doctor_speciality_en:
                            type:
                            - string
                            - 'null'
                      - type: object
                        description: Opt-in scope=history projection of one scheduled
                          encounter. Consultation identity is resolved through the
                          authorized patient and a kept, owned encounter. A null consultation_id
                          means no accessible kept consultation; it never establishes
                          nonattendance. Private consultation causes are masked. No
                          internal metadata or clinical detail is included. Specialties
                          can be null when the schedule account is unavailable. Existing
                          clients receive ConsultationSchedule.
                        additionalProperties: false
                        required:
                        - id
                        - cause
                        - starts_at
                        - ends_at
                        - doctor_name
                        - doctor_image
                        - organization_name
                        - patient_name
                        - schedule_type
                        - status
                        - can_confirm_schedule
                        - can_cancel_schedule
                        - doctor_speciality
                        - doctor_speciality_es
                        - doctor_speciality_en
                        - encounter_id
                        - consultation_id
                        - consultation_finished_at
                        - arrival_at
                        - missed_at
                        - cancellation_status
                        - cancelled_at
                        - time_zone
                        properties:
                          id:
                            type: integer
                          cause:
                            type:
                            - string
                            - 'null'
                          starts_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          ends_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          doctor_name:
                            type:
                            - string
                            - 'null'
                          doctor_image:
                            type: string
                          organization_name:
                            type:
                            - string
                            - 'null'
                          patient_name:
                            type: string
                          schedule_type:
                            type:
                            - string
                            - 'null'
                          status:
                            type:
                            - string
                            - 'null'
                          can_confirm_schedule:
                            type: boolean
                          can_cancel_schedule:
                            type: boolean
                          doctor_speciality:
                            type:
                            - string
                            - 'null'
                          doctor_speciality_es:
                            type:
                            - string
                            - 'null'
                          doctor_speciality_en:
                            type:
                            - string
                            - 'null'
                          encounter_id:
                            type:
                            - integer
                            - 'null'
                            description: Owned, kept encounter identity; null for
                              missing, deleted or foreign encounters. Never use this
                              ID as a consultation-detail ID.
                          consultation_id:
                            type:
                            - integer
                            - 'null'
                            description: Kept consultation owned by the authorized
                              patient, linked through the kept encounter. Use this
                              ID with the existing consultation-detail endpoint.
                          consultation_finished_at:
                            allOf:
                            - type:
                              - string
                              - 'null'
                              format: date-time
                            description: Explicit completion timestamp of the linked
                              consultation; null while in progress or when no accessible
                              consultation exists.
                          arrival_at:
                            allOf:
                            - type:
                              - string
                              - 'null'
                              format: date-time
                            description: Explicit patient check-in timestamp. Does
                              not prove clinical completion.
                          missed_at:
                            allOf:
                            - type:
                              - string
                              - 'null'
                              format: date-time
                            description: Explicitly recorded nonattendance timestamp.
                              An elapsed appointment or absent consultation never
                              supplies this value.
                          cancelled_at:
                            allOf:
                            - type:
                              - string
                              - 'null'
                              format: date-time
                            description: Soft-delete timestamp only for cancellation_request_accepted.
                              Null for pending/rejected requests and accepted rows
                              without a deletion timestamp.
                          cancellation_status:
                            type:
                            - string
                            - 'null'
                            enum:
                            - pending_cancellation
                            - cancellation_request_rejected
                            - cancellation_request_accepted
                            -
                            description: Explicit stored cancellation-request state,
                              independent of the presentation status. Null for other
                              stored states.
                          time_zone:
                            type: string
                            description: IANA timezone from the schedule account's
                              configuration.timezone, validated through ActiveSupport::TimeZone.
                              Missing/invalid settings or a missing account fall back
                              to America/Monterrey, matching the staff timezone default
                              independently of the application timezone. Timestamps
                              retain their absolute values; history retrieval applies
                              no calendar-day cutoff.
                            example: America/Monterrey
                        example:
                          id: 71001
                          cause: Synthetic follow-up
                          starts_at: '2026-06-24T15:00:00Z'
                          ends_at: '2026-06-24T15:30:00Z'
                          doctor_name: Example Doctor
                          doctor_image: ''
                          organization_name: Example Clinic
                          patient_name: Example Patient
                          schedule_type: appointment
                          status: started
                          can_confirm_schedule: false
                          can_cancel_schedule: false
                          doctor_speciality: Medicina general
                          doctor_speciality_es: Medicina general
                          doctor_speciality_en: General medicine
                          encounter_id: 72001
                          consultation_id: 73001
                          consultation_finished_at: '2026-06-24T15:30:00Z'
                          arrival_at: '2026-06-24T14:55:00Z'
                          missed_at:
                          cancellation_status:
                          cancelled_at:
                          time_zone: America/Monterrey
                  meta:
                    type: object
                    required:
                    - total_pages
                    additionalProperties: false
                    properties:
                      total_pages:
                        type: integer
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        '404':
          description: The requested resource was not found or is outside the authorized
            patient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_found:
                  value:
                    error: Not found
