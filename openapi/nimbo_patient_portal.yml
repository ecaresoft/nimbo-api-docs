---
openapi: 3.1.0
info:
  title: Nimbo patient portal
  version: 1.0.0
  description: Nimbo API reference. Use the API host and integration access provided
    by Nimbo.
servers:
- url: https://api.example.test
paths:
  "/api/v1/patient_portal/auth":
    post:
      summary: Request a patient portal OTP
      responses:
        '200':
          description: The request succeeded.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                country_code:
                  type: string
                phone:
                  type: string
      operationId: customerPatientPortalAuth
      tags:
      - Patient portal authentication
      security: []
      description: Requests a one-time code for the patient phone number. Use the
        country code and phone fields supplied for your integration.
  "/api/v1/patient_portal/validate":
    post:
      summary: Validate a patient portal OTP
      responses:
        '200':
          description: A patient portal token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                country_code:
                  type: string
                phone:
                  type: string
      operationId: customerPatientPortalValidate
      tags:
      - Patient portal authentication
      security: []
      description: Exchanges the one-time code and patient phone number for a patient
        portal token. Use this token to access the people authorized for that patient
        session.
  "/api/v1/patient_portal/people":
    get:
      tags:
      - Patient Portal
      operationId: listPatientPortalPeople
      summary: List people attached to the current patient token
      description: Lists the non-deleted people authorized for the patient portal
        token, newest first. The response includes chat availability; a chat-service
        connection failure can cause the request to fail.
      security:
      - PatientPortalToken: []
      responses:
        '200':
          description: Non-deleted people available to the patient token, newest created
            first.
          content:
            application/json:
              schema:
                type: object
                required:
                - people
                additionalProperties: false
                properties:
                  people:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - full_name
                      - organization_name
                      - doctor_name
                      - telephone2
                      - rooms
                      - avatar_url_large
                      - born_at
                      - gender
                      - medical_history_config
                      additionalProperties: false
                      properties:
                        id:
                          type: integer
                        full_name:
                          type: string
                          example: Demo Patient
                        organization_name:
                          type:
                          - string
                          - 'null'
                        doctor_name:
                          type: string
                        telephone2:
                          type:
                          - string
                          - 'null'
                        rooms:
                          type: boolean
                          description: True only when the person's organization has
                            the shared chat entitlement and Firebase returns a non-null
                            chatrooms node. Missing or deleted nodes and organizations
                            without the entitlement return false.
                        avatar_url_large:
                          type: string
                          description: One-hour Paperclip avatar URL, or an empty
                            string when no avatar exists.
                          example: https://synthetic-patient-assets.example.test/people/avatars/000/001/001/large/avatar.png
                        born_at:
                          type:
                          - string
                          - 'null'
                          format: date
                        gender:
                          type:
                          - string
                          - 'null'
                        medical_history_config:
                          type:
                          - object
                          - 'null'
                          additionalProperties: true
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        '500':
          description: Firebase could not be reached while resolving chat rooms for
            an entitled patient. The error body is runtime-dependent, matching the
            unhandled transport-failure behavior.
  "/api/v1/patient_portal/people/{person_id}/organization":
    get:
      tags:
      - Patient Portal
      operationId: showPatientPortalPersonOrganization
      summary: Show an authorized patient's public organization
      security:
      - PatientPortalToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: integer
        example: 123
      responses:
        '200':
          description: Public organization data visible for the authorized patient.
          content:
            application/json:
              schema:
                type: object
                required:
                - public_organization
                additionalProperties: false
                properties:
                  public_organization:
                    type: object
                    required:
                    - id
                    - name
                    - owner_id
                    - tax_name
                    - tax_rfc
                    - tax_address_one
                    - tax_address_two
                    - tax_zip_code
                    - tax_exterior_number
                    - tax_interior_number
                    - tax_city
                    - tax_state
                    - tax_country
                    - kind
                    - slug
                    - username
                    - telehealth_request_slug
                    - slug_organization_portal
                    - options
                    - logo
                    - waiting_room_configuration
                    - owner_country_code
                    - validations
                    - insurance_company_required
                    - landing_page_info
                    - subscription_expired
                    - available_chat
                    - patient_portal_chat_disabled
                    additionalProperties: false
                    properties:
                      id:
                        type: integer
                      name:
                        type:
                        - string
                        - 'null'
                      owner_id:
                        type:
                        - integer
                        - 'null'
                      tax_name:
                        type:
                        - string
                        - 'null'
                      tax_rfc:
                        type:
                        - string
                        - 'null'
                      tax_address_one:
                        type:
                        - string
                        - 'null'
                      tax_address_two:
                        type:
                        - string
                        - 'null'
                      tax_zip_code:
                        type:
                        - string
                        - 'null'
                      tax_exterior_number:
                        type:
                        - string
                        - 'null'
                      tax_interior_number:
                        type:
                        - string
                        - 'null'
                      tax_city:
                        type:
                        - string
                        - 'null'
                      tax_state:
                        type:
                        - string
                        - 'null'
                      tax_country:
                        type:
                        - string
                        - 'null'
                      kind:
                        type:
                        - string
                        - 'null'
                      slug:
                        type:
                        - string
                        - 'null'
                      username:
                        type:
                        - string
                        - 'null'
                      telehealth_request_slug:
                        type:
                        - string
                        - 'null'
                      slug_organization_portal:
                        type:
                        - string
                        - 'null'
                        example: demo-main
                      options:
                        type: object
                        additionalProperties: true
                      logo:
                        type: string
                        example: https://s3.amazonaws.com/synthetic-assets/images/images/000/000/789/medium/clinic-logo.png
                      waiting_room_configuration:
                        type: object
                        additionalProperties: true
                      owner_country_code:
                        type:
                        - string
                        - 'null'
                        example: "+52"
                      validations:
                        type:
                        - object
                        - 'null'
                        additionalProperties: true
                      insurance_company_required:
                        type: boolean
                      landing_page_info:
                        type: object
                        additionalProperties: true
                      subscription_expired:
                        type:
                        - boolean
                        - 'null'
                      available_chat:
                        type:
                        - boolean
                        - 'null'
                      patient_portal_chat_disabled:
                        type: boolean
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        '404':
          description: The requested resource was not found or is outside the authorized
            patient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_found:
                  value:
                    error: Not found
  "/api/v1/patient_portal/people/{person_id}/medical_history":
    get:
      tags:
      - Patient Portal
      operationId: showPatientPortalPersonMedicalHistory
      summary: Show or create an authorized patient's medical history
      description: Returns the medical history for an authorized patient. If no active
        history exists, this read creates a new medical history record.
      security:
      - PatientPortalToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: integer
        example: 123
      responses:
        '200':
          description: Medical history visible to the authorized patient.
          content:
            application/json:
              schema:
                type: object
                required:
                - medical_history
                additionalProperties: false
                properties:
                  medical_history:
                    type: object
                    required:
                    - records
                    - editable
                    - id
                    additionalProperties: false
                    properties:
                      id:
                        type: integer
                      editable:
                        type: boolean
                      records:
                        type: object
                        additionalProperties: true
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        '404':
          description: The requested resource was not found or is outside the authorized
            patient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_found:
                  value:
                    error: Not found
