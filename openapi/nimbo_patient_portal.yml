  "/api/v1/patient_portal/consultations/{id}":
    get:
      tags:
      - Patient Portal
      operationId: showPatientPortalConsultation
      summary: Show an authorized consultation detail
      description: Adds organization and location from the encounter's recorded location.
        The location includes its current address, city, postal code, telephone, state
        and country, not a historical snapshot. Inactive locations remain visible;
        absent or soft-deleted encounters or locations return null organization/location
        fields. All fields are present for an existing location, preserving Default
        names, empty strings and placeholders. Numeric address/contact values become
        strings without inferred formatting; missing or unsupported values are null.
        Invalid office stores retain location identity/geography with null text fields.
        No physician or organization address fallback is applied. organization_name
        retains its existing physician-account meaning. These reads do not change
        stored data or deliver provider messages.
      security:
      - PatientPortalToken: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: '123'
      responses:
        '200':
          description: Non-deleted consultation detail with kept nested notes, lab
            orders, and lab results.
          content:
            application/json:
              schema:
                type: object
                required:
                - consultation
                additionalProperties: false
                properties:
                  consultation:
                    type: object
                    required:
                    - id
                    - cause
                    - starts_at
                    - doctor_name
                    - organization_name
                    - organization
                    - location
                    - notes
                    - lab_tests
                    - instructions
                    - treatment
                    - vital_signs_set
                    - medical_history_attachments
                    - lab_test_results
                    - prescriptions
                    additionalProperties: false
                    properties:
                      id:
                        type: integer
                      cause:
                        type:
                        - string
                        - 'null'
                      starts_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                      doctor_name:
                        type:
                        - string
                        - 'null'
                      organization_name:
                        type:
                        - string
                        - 'null'
                        description: Physician account's current organization name;
