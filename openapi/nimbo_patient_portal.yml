                          address and contact information. Uses the same resolution
                          and historical-membership rules as the summary. Every documented
                          field is present for an existing location. Address, city,
                          postal code and telephone preserve stored strings, including
                          empty strings and placeholders; numeric values are serialized
                          as strings without inferring missing formatting or leading
                          zeros. Missing, boolean, array and object field values are
                          null. A non-object office store makes these four text fields
                          null without hiding the location or its geography. No organization
                          or physician address/contact fallback is applied.
                        required:
                        - id
                        - name
                        - active
                        - address
                        - city
                        - postal_code
                        - telephone
                        - state
                        - country
                        additionalProperties: false
                        properties:
                          id:
