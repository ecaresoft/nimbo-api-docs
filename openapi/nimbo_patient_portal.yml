                              remove a historical location.
                          address:
                            type:
                            - string
                            - 'null'
                            description: Branch address as text, without inferred
                              formatting or supplementation.
                          city:
                            type:
                            - string
                            - 'null'
                          postal_code:
                            type:
                            - string
                            - 'null'
                          telephone:
                            type:
                            - string
                            - 'null'
                          state:
