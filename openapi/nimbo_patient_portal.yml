---
openapi: 3.1.0
info:
  title: Nimbo patient portal
  version: 1.0.0
  description: Nimbo API reference. Use the API host and integration access provided
    by Nimbo.
servers:
- url: https://api.example.test
paths:
  "/api/v1/patient_portal/auth":
    post:
      summary: Request a patient portal OTP
      responses:
        '200':
          description: The request succeeded.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                country_code:
                  type: string
                phone:
                  type: string
      operationId: customerPatientPortalAuth
      tags:
      - Patient portal authentication
      security: []
      description: Requests a one-time code for the patient phone number. Use the
        country code and phone fields supplied for your integration.
  "/api/v1/patient_portal/validate":
    post:
      summary: Validate a patient portal OTP
      responses:
        '200':
          description: A patient portal token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                country_code:
                  type: string
                phone:
                  type: string
      operationId: customerPatientPortalValidate
      tags:
      - Patient portal authentication
      security: []
      description: Exchanges the one-time code and patient phone number for a patient
        portal token. Use this token to access the people authorized for that patient
        session.
  "/api/v1/patient_portal/people":
    get:
      tags:
      - Patient Portal
      operationId: listPatientPortalPeople
      summary: List people attached to the current patient token
      description: Lists the non-deleted people authorized for the patient portal
        token, newest first. The response includes chat availability; a chat-service
        connection failure can cause the request to fail.
      security:
      - PatientPortalToken: []
      responses:
        '200':
          description: Non-deleted people available to the patient token, newest created
            first.
          content:
            application/json:
              schema:
                type: object
                required:
                - people
                additionalProperties: false
                properties:
                  people:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - full_name
                      - organization_name
                      - doctor_name
                      - telephone2
                      - rooms
                      - avatar_url_large
                      - born_at
                      - gender
                      - medical_history_config
                      additionalProperties: false
                      properties:
                        id:
                          type: integer
                        full_name:
                          type: string
                          example: Demo Patient
                        organization_name:
                          type:
                          - string
                          - 'null'
                        doctor_name:
                          type: string
                        telephone2:
                          type:
                          - string
                          - 'null'
                        rooms:
                          type: boolean
                          description: True only when the person's organization has
                            the shared chat entitlement and Firebase returns a non-null
                            chatrooms node. Missing or deleted nodes and organizations
                            without the entitlement return false.
                        avatar_url_large:
                          type: string
                          description: One-hour Paperclip avatar URL, or an empty
                            string when no avatar exists.
                          example: https://synthetic-patient-assets.example.test/people/avatars/000/001/001/large/avatar.png
                        born_at:
                          type:
                          - string
                          - 'null'
                          format: date
                        gender:
                          type:
                          - string
                          - 'null'
                        medical_history_config:
                          type:
                          - object
                          - 'null'
                          additionalProperties: true
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        '500':
          description: Firebase could not be reached while resolving chat rooms for
            an entitled patient. The error body is runtime-dependent, matching the
            unhandled transport-failure behavior.
  "/api/v1/patient_portal/people/{person_id}/organization":
    get:
      tags:
      - Patient Portal
      operationId: showPatientPortalPersonOrganization
      summary: Show an authorized patient's public organization
      description: Returns public settings and computed flags under public_organization.
        Tax identity and address fields and private option groups are omitted. Computed
        insurance and chat flags still use the stored configuration.
      security:
      - PatientPortalToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: integer
        example: 123
      responses:
        '200':
          description: Public organization data visible for the authorized patient.
          content:
            application/json:
              schema:
                type: object
                required:
                - public_organization
                additionalProperties: false
                properties:
                  public_organization:
                    type: object
                    required:
                    - id
                    - name
                    - owner_id
                    - kind
                    - slug
                    - username
                    - telehealth_request_slug
                    - slug_organization_portal
                    - options
                    - logo
                    - waiting_room_configuration
                    - owner_country_code
                    - validations
                    - insurance_company_required
                    - landing_page_info
                    - subscription_expired
                    - available_chat
                    - patient_portal_chat_disabled
                    additionalProperties: false
                    properties:
                      id:
                        type: integer
                      name:
                        type:
                        - string
                        - 'null'
                      owner_id:
                        type:
                        - integer
                        - 'null'
                      kind:
                        type:
                        - string
                        - 'null'
                      slug:
                        type:
                        - string
                        - 'null'
                      username:
                        type:
                        - string
                        - 'null'
                      telehealth_request_slug:
                        type:
                        - string
                        - 'null'
                      slug_organization_portal:
                        type:
                        - string
                        - 'null'
                        example: demo-main
                      options:
                        type: object
                        description: Public organization options. Private integration
                          groups, provider credentials, internal MRN controls, contact
                          settings, password policies and two-factor settings are
                          excluded at the top level, including all their nested values.
                          Missing or null stored options produce an empty object.
                        additionalProperties: true
                        example:
                          telehealth: true
                          patient_portal_chat_disabled: false
                          share_medical_history: true
                      logo:
                        type: string
                        example: https://s3.amazonaws.com/synthetic-assets/images/images/000/000/789/medium/clinic-logo.png
                      waiting_room_configuration:
                        type: object
                        additionalProperties: true
                      owner_country_code:
                        type:
                        - string
                        - 'null'
                        example: "+52"
                      validations:
                        type:
                        - object
                        - 'null'
                        additionalProperties: true
                      insurance_company_required:
                        type: boolean
                      landing_page_info:
                        type: object
                        additionalProperties: true
                      subscription_expired:
                        type:
                        - boolean
                        - 'null'
                      available_chat:
                        type:
                        - boolean
                        - 'null'
                      patient_portal_chat_disabled:
                        type: boolean
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        '404':
          description: The requested resource was not found or is outside the authorized
            patient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_found:
                  value:
                    error: Not found
  "/api/v1/patient_portal/people/{person_id}/medical_history":
    get:
      tags:
      - Patient Portal
      operationId: showPatientPortalPersonMedicalHistory
      summary: Show or create an authorized patient's medical history
      description: Requires clinical sharing to be enabled for the authorized patient;
        otherwise returns 403 before accessing clinical data. Returns configured record
        groups, free-text records.allergies and saved medical_history_allergies catalogue
        entries. If no active history exists, this read creates a new medical history
        record. The editable field is true only when patient editing is enabled, including
        for a newly created history.
      security:
      - PatientPortalToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: integer
        example: 123
      responses:
        '200':
          description: Medical history visible to the authorized patient.
          content:
            application/json:
              schema:
                type: object
                required:
                - medical_history
                additionalProperties: false
                properties:
                  medical_history:
                    type: object
                    required:
                    - records
                    - medical_history_allergies
                    - editable
                    - id
                    additionalProperties: false
                    properties:
                      id:
                        type: integer
                      editable:
                        type: boolean
                      records:
                        type: object
                        additionalProperties: true
                      medical_history_allergies:
                        type: array
                        description: 'Non-deleted catalogue allergies belonging to
                          this history, in ascending ID order. Independent of records.allergies
                          and the configured record groups; empty when there are no
                          entries. Uses persisted catalogue fields.

                          '
                        items:
                          type: object
                          required:
                          - id
                          - medical_history_id
                          - allergy_id
                          - name
                          - drug_data_identifier
                          - updater_name
                          - metadata
                          additionalProperties: false
                          properties:
                            id:
                              type: integer
                            medical_history_id:
                              type: integer
                            allergy_id:
                              type:
                              - integer
                              - 'null'
                            name:
                              type:
                              - string
                              - 'null'
                            drug_data_identifier:
                              type:
                              - string
                              - 'null'
                            updater_name:
                              type: string
                              enum:
                              - ''
                            metadata:
                              description: Persisted JSON metadata, including null,
                                without normalization.
                          example:
                            id: 101
                            medical_history_id: 201
                            allergy_id: 301
                            name: Synthetic catalogue entry
                            drug_data_identifier: synthetic-301
                            updater_name: ''
                            metadata: {}
                        example: []
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        '403':
          description: The patient's organization has not explicitly enabled clinical-data
            sharing.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_shared:
                  value:
                    error: Clinical data is not shared
        '404':
          description: The requested resource was not found or is outside the authorized
            patient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_found:
                  value:
                    error: Not found
  "/api/v1/patient_portal/people/{person_id}/vital_signs":
    get:
      tags:
      - Patient Portal
      operationId: showPatientPortalPersonVitalSigns
      summary: Show merged patient-facing vital signs
      description: 'Requires the authorized patient''s organization to set share_medical_history
        to the boolean true. Missing, false, null, malformed, or absent organization
        settings return 403 before reading, creating, updating, or auditing clinical
        data.

        '
      security:
      - PatientPortalToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: integer
        example: 123
      responses:
        '200':
          description: Non-deleted vital-sign sets merged in created-at ascending
            order.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  required:
                  - vital_signs
                  additionalProperties: false
                  properties:
                    vital_signs:
                      type: object
                      required:
                      - id
                      - consultation_id
                      - person_id
                      - account_id
                      - elements
                      - created_at
                      - updated_at
                      - deleted_at
                      - set_type
                      - metadata
                      additionalProperties: false
                      properties:
                        id:
                          type: integer
                        consultation_id:
                          type:
                          - integer
                          - 'null'
                        person_id:
                          type: integer
                        account_id:
                          type:
                          - integer
                          - 'null'
                        elements:
                          type: object
                          additionalProperties: true
                        created_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        updated_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        deleted_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        set_type:
                          type:
                          - string
                          - 'null'
                        metadata:
                          type: object
                          additionalProperties: true
                - type: 'null'
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        '403':
          description: The patient's organization has not explicitly enabled clinical-data
            sharing.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_shared:
                  value:
                    error: Clinical data is not shared
        '404':
          description: The requested resource was not found or is outside the authorized
            patient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_found:
                  value:
                    error: Not found
  "/api/v1/patient_portal/people/{person_id}/vital_signs_history":
    get:
      tags:
      - Patient Portal
      operationId: listPatientPortalPersonVitalSignsHistory
      summary: List a patient's separate vital-sign captures
      description: Additive, read-only history; does not change the existing merged
        summary. Requires an authorized non-deleted patient and share_medical_history
        exactly true in that patient's organization. Store-review sessions retain
        their configured patient restrictions. Returns non-deleted captures with at
        least one populated measurement, including historical custom measurements,
        ordered by recorded_at descending (missing dates last), then capture ID descending.
        Pagination counts captures, not encounters; one encounter may span pages.
        An optional encounter_id selects only captures from that patient's encounter's
        single kept consultation. A missing, deleted, inaccessible or ambiguous encounter
        returns 404; an authorized encounter without a consultation returns an empty
        collection. No writes, audit events or provider calls occur.
      security:
      - PatientPortalToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: integer
        example: 123
      - name: encounter_id
        in: query
        description: Optional parent encounter ID, distinct from consultation ID.
          Must identify a non-deleted encounter belonging to the selected patient;
          invalid values return 404. Omit to include standalone captures and captures
          from all visits.
        schema:
          type: integer
          minimum: 1
      - name: page
        in: query
        description: Nonpositive or nonnumeric input defaults to 1; values above the
          maximum are clamped.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 1
        example: 1
      - name: per_page
        in: query
        description: Nonpositive or nonnumeric input defaults to 20; values above
          50 are clamped to 50.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        example: 20
      responses:
        '200':
          description: Separate saved captures. Empty history and out-of-range pages
            return an empty array; total_pages is zero only when no eligible captures
            match. Field labels and units come from saved content, without consulting
            today's field configuration.
          content:
            application/json:
              schema:
                type: object
                required:
                - vital_signs_history
                - meta
                additionalProperties: false
                properties:
                  vital_signs_history:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - consultation_id
                      - encounter_id
                      - encounter
                      - recorded_at
                      - updated_at
                      - set_type
                      - clinician
                      - measurements
                      additionalProperties: false
                      properties:
                        id:
                          type: integer
                          description: Stable saved-capture identity; multiple captures
                            can belong to the same encounter.
                        consultation_id:
                          type:
                          - integer
                          - 'null'
                          description: Linked kept consultation owned by the selected
                            patient; null when absent or inaccessible.
                        encounter_id:
                          type:
                          - integer
                          - 'null'
                          description: Parent encounter ID, distinct from consultation_id;
                            null when absent, deleted or inaccessible.
                        encounter:
                          oneOf:
                          - type: object
                            required:
                            - id
                            - starts_at
                            - cause
                            additionalProperties: false
                            properties:
                              id:
                                type: integer
                              starts_at:
                                type:
                                - string
                                - 'null'
                                format: date-time
                              cause:
                                type:
                                - string
                                - 'null'
                                description: Encounter heading; private consultation
                                  causes are masked with the existing portal placeholder.
                          - type: 'null'
                        recorded_at:
                          allOf:
                          - type:
                            - string
                            - 'null'
                            format: date-time
                          description: Stored capture created_at, possibly supplied
                            during creation; not an independently recorded measurement
                            time.
                        updated_at:
                          allOf:
                          - type:
                            - string
                            - 'null'
                            format: date-time
                          description: Latest saved modification; previous overwritten
                            values are not reconstructed.
                        set_type:
                          type:
                          - string
                          - 'null'
                          description: Original capture grouping, without restricting
                            history to a fixed vital-sign list.
                        clinician:
                          oneOf:
                          - type: object
                            required:
                            - id
                            - name
                            additionalProperties: false
                            description: Account attributed to the capture; not proof
                              of who performed or entered the measurement.
                            properties:
                              id:
                                type: integer
                              name:
                                type:
                                - string
                                - 'null'
                          - type: 'null'
                        measurements:
                          type: array
                          minItems: 1
                          description: Populated scalar measurements in this capture,
                            with no carry-forward from other captures. Includes custom
                            fields regardless of current activation. Nulls, whitespace-only
                            strings, objects, arrays and unfilled definitions are
                            omitted; zero and false are preserved. Current canonical
                            elements override the newest same-organization custom-form
                            snapshot for each key, including explicit clears. A snapshot
                            supplies missing keys only when its updated_at is at least
                            the capture's updated_at and both timestamps are known,
                            so older snapshots cannot restore values omitted on edits.
                            Whitespace means the explicit Unicode White_Space code-point
                            set, independent of database locale. Measurement order
                            is not significant.
                          items:
                            type: object
                            required:
                            - key
                            - value
                            - units
                            - label
                            - custom
                            additionalProperties: false
                            properties:
                              key:
                                type: string
                                description: Original field key; do not identify measurements
                                  by label alone.
                              value:
                                type:
                                - string
                                - number
                                - boolean
                                description: Original stored scalar value, without
                                  coercion or unit conversion.
                              units:
                                type:
                                - string
                                - 'null'
                                description: First populated saved string from units
                                  or unit; null when neither is valid, with no current-catalog
                                  substitution.
                              label:
                                type:
                                - string
                                - 'null'
                                description: Saved label when available; clients can
                                  localize standard keys or show the original key
                                  as a fallback.
                              custom:
                                type: boolean
                                description: Saved custom flag, or true for a measurement
                                  supplied only by the custom-form response.
                  meta:
                    type: object
                    required:
                    - page
                    - per_page
                    - total_pages
                    additionalProperties: false
                    properties:
                      page:
                        type: integer
                        minimum: 1
                      per_page:
                        type: integer
                        minimum: 1
                        maximum: 50
                      total_pages:
                        type: integer
                        minimum: 0
              example:
                vital_signs_history: []
                meta:
                  page: 1
                  per_page: 20
                  total_pages: 0
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        '403':
          description: The patient's organization has not explicitly enabled clinical-data
            sharing.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_shared:
                  value:
                    error: Clinical data is not shared
        '404':
          description: The requested resource was not found or is outside the authorized
            patient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_found:
                  value:
                    error: Not found
  "/api/v1/patient_portal/people/{person_id}/lab_tests":
    get:
      tags:
      - Patient Portal
      operationId: showPatientPortalPersonLabTests
      summary: Show patient-facing lab test results
      description: 'Requires the authorized patient''s organization to set share_medical_history
        to the boolean true. Missing, false, null, malformed, or absent organization
        settings return 403 before reading, creating, updating, or auditing clinical
        data.

        '
      security:
      - PatientPortalToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: integer
        example: 123
      responses:
        '200':
          description: Earliest non-deleted result from the newest non-deleted consultation,
            or an empty list.
          content:
            application/json:
              schema:
                type: object
                required:
                - lab_tests
                additionalProperties: false
                properties:
                  lab_tests:
                    oneOf:
                    - type: object
                      required:
                      - id
                      - consultation_id
                      - elements
                      - created_at
                      additionalProperties: false
                      properties:
                        id:
                          type: integer
                        consultation_id:
                          type: integer
                        elements:
                          type: object
                          additionalProperties: true
                        created_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                    - type: array
                      items:
                        type: object
                        additionalProperties: true
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        '403':
          description: The patient's organization has not explicitly enabled clinical-data
            sharing.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_shared:
                  value:
                    error: Clinical data is not shared
        '404':
          description: The requested resource was not found or is outside the authorized
            patient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_found:
                  value:
                    error: Not found
  "/api/v1/patient_portal/people/{person_id}/attachments":
    get:
      tags:
      - Patient Portal
      operationId: listPatientPortalPersonAttachments
      summary: List patient-shared medical history attachments
      security:
      - PatientPortalToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: integer
        example: 123
      responses:
        '200':
          description: Non-deleted attachments explicitly shared below a non-deleted
            medical-history parent, ordered by ID.
          content:
            application/json:
              schema:
                type: object
                required:
                - attachments
                additionalProperties: false
                properties:
                  attachments:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - attachment_file_name
                      - attachment_file_name_alias
                      - consultation_id
                      - attachment_content_type
                      - medical_history_id
                      - attachment_file_url
                      - attachment_file_size
                      - created_at
                      - updated_at
                      - updater_name
                      - metadata
                      - attachment_file_original_url
                      additionalProperties: false
                      properties:
                        id:
                          type: integer
                        attachment_file_name:
                          type:
                          - string
                          - 'null'
                        attachment_file_name_alias:
