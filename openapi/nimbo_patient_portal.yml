---
openapi: 3.1.0
info:
  title: Nimbo patient portal
  version: 1.0.0
  description: Nimbo API reference. Use the API host and integration access provided
    by Nimbo.
servers:
- url: https://api.example.test
paths:
  "/api/v1/patient_portal/auth":
    post:
      summary: Request a patient portal OTP
      responses:
        '200':
          description: The code was requested. A request with supports_six_digit_otp
            set to true can return the issued code length as JSON. An empty success
            indicates a four-digit code.
          content:
            application/json:
              schema:
                type: object
                required:
                - code_length
                properties:
                  code_length:
                    type: integer
                    enum:
                    - 4
                    - 6
                    description: Number of digits to enter for this request.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                country_code:
                  type: string
                phone:
                  type: string
                supports_six_digit_otp:
                  type: boolean
                  default: false
                  description: Send true on the initial request and on resends when
                    your client accepts either code length.
      operationId: customerPatientPortalAuth
      tags:
      - Patient portal authentication
      security: []
      description: Requests a one-time code for the patient phone number. Requests
        that omit supports_six_digit_otp use four digits and receive an empty success
        response. A successful resend replaces the previous code for this phone.
  "/api/v1/patient_portal/validate":
    post:
      summary: Validate a patient portal OTP
      responses:
        '200':
          description: A patient portal token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: "^(?:[0-9]{4}|[1-9][0-9]{5})$"
                  description: Enter the code at the issued length and preserve any
                    leading zeros.
                country_code:
                  type: string
                phone:
                  type: string
      operationId: customerPatientPortalValidate
      tags:
      - Patient portal authentication
      security: []
      description: Exchanges the one-time code and patient phone number for a patient
        portal token. Use this token to access the people authorized for that patient
        session.
  "/api/v1/patient_portal/people":
    get:
      tags:
      - Patient Portal
      operationId: listPatientPortalPeople
      summary: List people attached to the current patient token
      description: Lists the non-deleted people authorized for the patient portal
        token, newest first. The response includes chat availability; a chat-service
        connection failure can cause the request to fail.
      security:
      - PatientPortalToken: []
      responses:
        '200':
          description: Non-deleted people available to the patient token, newest created
            first.
          content:
            application/json:
              schema:
                type: object
                required:
                - people
                additionalProperties: false
                properties:
                  people:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - full_name
                      - organization_name
                      - doctor_name
                      - telephone2
                      - rooms
                      - avatar_url_large
                      - born_at
                      - gender
                      - medical_history_config
                      additionalProperties: false
                      properties:
                        id:
                          type: integer
                        full_name:
                          type: string
                          example: Demo Patient
                        organization_name:
                          type:
                          - string
                          - 'null'
                        doctor_name:
                          type: string
                        telephone2:
                          type:
                          - string
                          - 'null'
                        rooms:
                          type: boolean
                          description: True only when the person's organization has
                            the shared chat entitlement and Firebase returns a non-null
                            chatrooms node. Missing or deleted nodes and organizations
                            without the entitlement return false.
                        avatar_url_large:
                          type: string
                          description: One-hour Paperclip avatar URL, or an empty
                            string when no avatar exists.
                          example: https://synthetic-patient-assets.example.test/people/avatars/000/001/001/large/avatar.png
                        born_at:
                          type:
                          - string
                          - 'null'
                          format: date
                        gender:
                          type:
                          - string
                          - 'null'
                        medical_history_config:
                          type:
                          - object
                          - 'null'
                          additionalProperties: true
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        '500':
          description: Firebase could not be reached while resolving chat rooms for
            an entitled patient. The error body is runtime-dependent, matching the
            unhandled transport-failure behavior.
  "/api/v1/patient_portal/people/{person_id}/organization":
    get:
      tags:
      - Patient Portal
      operationId: showPatientPortalPersonOrganization
      summary: Show an authorized patient's public organization
      description: Returns public settings and computed flags under public_organization.
        Tax identity and address fields and private option groups are omitted. Computed
        insurance and chat flags still use the stored configuration.
      security:
      - PatientPortalToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: integer
        example: 123
      responses:
        '200':
          description: Public organization data visible for the authorized patient.
          content:
            application/json:
              schema:
                type: object
                required:
                - public_organization
                additionalProperties: false
                properties:
                  public_organization:
                    type: object
                    required:
                    - id
                    - name
                    - owner_id
                    - kind
                    - slug
                    - username
                    - telehealth_request_slug
                    - slug_organization_portal
                    - options
                    - logo
                    - waiting_room_configuration
                    - owner_country_code
                    - validations
                    - insurance_company_required
                    - landing_page_info
                    - subscription_expired
                    - available_chat
                    - patient_portal_chat_disabled
                    additionalProperties: false
                    properties:
                      id:
                        type: integer
                      name:
                        type:
                        - string
                        - 'null'
                      owner_id:
                        type:
                        - integer
                        - 'null'
                      kind:
                        type:
                        - string
                        - 'null'
                      slug:
                        type:
                        - string
                        - 'null'
                      username:
                        type:
                        - string
                        - 'null'
                      telehealth_request_slug:
                        type:
                        - string
                        - 'null'
                      slug_organization_portal:
                        type:
                        - string
                        - 'null'
                        example: demo-main
                      options:
                        type: object
                        description: Public organization options. Private integration
                          groups, provider credentials, internal MRN controls, contact
                          settings, password policies and two-factor settings are
                          excluded at the top level, including all their nested values.
                          Missing or null stored options produce an empty object.
                        additionalProperties: true
                        example:
                          telehealth: true
                          patient_portal_chat_disabled: false
                          share_medical_history: true
                      logo:
                        type: string
                        example: https://s3.amazonaws.com/synthetic-assets/images/images/000/000/789/medium/clinic-logo.png
                      waiting_room_configuration:
                        type: object
                        additionalProperties: true
                      owner_country_code:
                        type:
                        - string
                        - 'null'
                        example: "+52"
                      validations:
                        type:
                        - object
                        - 'null'
                        additionalProperties: true
                      insurance_company_required:
                        type: boolean
                      landing_page_info:
                        type: object
                        additionalProperties: true
                      subscription_expired:
                        type:
                        - boolean
                        - 'null'
                      available_chat:
                        type:
                        - boolean
                        - 'null'
                      patient_portal_chat_disabled:
                        type: boolean
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        '404':
          description: The requested resource was not found or is outside the authorized
            patient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_found:
                  value:
                    error: Not found
  "/api/v1/patient_portal/people/{person_id}/medical_history":
    get:
      tags:
      - Patient Portal
      operationId: showPatientPortalPersonMedicalHistory
      summary: Show or create an authorized patient's medical history
      description: Returns medical history when the patient’s organization has enabled
        sharing. Free-text allergies appear in records.allergies. Catalogue entries
        are returned separately in medical_history_allergies, which can be empty.
        If there is no active history, this read creates a new medical history record.
        The editable flag reflects the organization’s patient-editing setting.
      security:
      - PatientPortalToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: integer
        example: 123
      responses:
        '200':
          description: Medical history visible to the authorized patient.
          content:
            application/json:
              schema:
                type: object
                required:
                - medical_history
                additionalProperties: false
                properties:
                  medical_history:
                    type: object
                    required:
                    - records
                    - medical_history_allergies
                    - editable
                    - id
                    additionalProperties: false
                    properties:
                      id:
                        type: integer
                      editable:
                        type: boolean
                      records:
                        type: object
                        additionalProperties: true
                      medical_history_allergies:
                        type: array
                        description: 'Non-deleted catalogue allergies belonging to
                          this history, in ascending ID order. Independent of records.allergies
                          and the configured record groups; empty when there are no
                          entries. Uses persisted catalogue fields.

                          '
                        items:
                          type: object
                          required:
                          - id
                          - medical_history_id
                          - allergy_id
                          - name
                          - drug_data_identifier
                          - updater_name
                          - metadata
                          additionalProperties: false
                          properties:
                            id:
                              type: integer
                            medical_history_id:
                              type: integer
                            allergy_id:
                              type:
                              - integer
                              - 'null'
                            name:
                              type:
                              - string
                              - 'null'
                            drug_data_identifier:
                              type:
                              - string
                              - 'null'
                            updater_name:
                              type: string
                              enum:
                              - ''
                            metadata:
                              description: Persisted JSON metadata, including null,
                                without normalization.
                          example:
                            id: 101
                            medical_history_id: 201
                            allergy_id: 301
                            name: Synthetic catalogue entry
                            drug_data_identifier: synthetic-301
                            updater_name: ''
                            metadata: {}
                        example: []
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        '403':
          description: The patient's organization has not explicitly enabled clinical-data
            sharing.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_shared:
                  value:
                    error: Clinical data is not shared
        '404':
          description: The requested resource was not found or is outside the authorized
            patient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_found:
                  value:
                    error: Not found
  "/api/v1/patient_portal/people/{person_id}/vital_signs":
    get:
      tags:
      - Patient Portal
      operationId: showPatientPortalPersonVitalSigns
      summary: Show merged patient-facing vital signs
      description: 'Requires the authorized patient''s organization to set share_medical_history
        to the boolean true. Missing, false, null, malformed, or absent organization
        settings return 403 before reading, creating, updating, or auditing clinical
        data.

        '
      security:
      - PatientPortalToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: integer
        example: 123
      responses:
        '200':
          description: Non-deleted vital-sign sets merged in created-at ascending
            order.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  required:
                  - vital_signs
                  additionalProperties: false
                  properties:
                    vital_signs:
                      type: object
                      required:
                      - id
                      - consultation_id
                      - person_id
                      - account_id
                      - elements
                      - created_at
                      - updated_at
                      - deleted_at
                      - set_type
                      - metadata
                      additionalProperties: false
                      properties:
                        id:
                          type: integer
                        consultation_id:
                          type:
                          - integer
                          - 'null'
                        person_id:
                          type: integer
                        account_id:
                          type:
                          - integer
                          - 'null'
                        elements:
                          type: object
                          additionalProperties: true
                        created_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        updated_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        deleted_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        set_type:
                          type:
                          - string
                          - 'null'
                        metadata:
                          type: object
                          additionalProperties: true
                - type: 'null'
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        '403':
          description: The patient's organization has not explicitly enabled clinical-data
            sharing.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_shared:
                  value:
                    error: Clinical data is not shared
        '404':
          description: The requested resource was not found or is outside the authorized
            patient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_found:
                  value:
                    error: Not found
  "/api/v1/patient_portal/people/{person_id}/lab_tests":
    get:
      tags:
      - Patient Portal
      operationId: showPatientPortalPersonLabTests
      summary: Show patient-facing lab test results
      description: 'Requires the authorized patient''s organization to set share_medical_history
        to the boolean true. Missing, false, null, malformed, or absent organization
        settings return 403 before reading, creating, updating, or auditing clinical
        data.

        '
      security:
      - PatientPortalToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: integer
        example: 123
      responses:
        '200':
          description: Earliest non-deleted result from the newest non-deleted consultation,
            or an empty list.
          content:
            application/json:
              schema:
                type: object
                required:
                - lab_tests
                additionalProperties: false
                properties:
                  lab_tests:
                    oneOf:
                    - type: object
                      required:
                      - id
                      - consultation_id
                      - elements
                      - created_at
                      additionalProperties: false
                      properties:
                        id:
                          type: integer
                        consultation_id:
                          type: integer
                        elements:
                          type: object
                          additionalProperties: true
                        created_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                    - type: array
                      items:
                        type: object
                        additionalProperties: true
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        '403':
          description: The patient's organization has not explicitly enabled clinical-data
            sharing.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_shared:
                  value:
                    error: Clinical data is not shared
        '404':
          description: The requested resource was not found or is outside the authorized
            patient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_found:
                  value:
                    error: Not found
  "/api/v1/patient_portal/people/{person_id}/attachments":
    get:
      tags:
      - Patient Portal
      operationId: listPatientPortalPersonAttachments
      summary: List patient-shared medical history attachments
      security:
      - PatientPortalToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: integer
        example: 123
      responses:
        '200':
          description: Non-deleted attachments explicitly shared below a non-deleted
            medical-history parent, ordered by ID.
          content:
            application/json:
              schema:
                type: object
                required:
                - attachments
                additionalProperties: false
                properties:
                  attachments:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - attachment_file_name
                      - attachment_file_name_alias
                      - consultation_id
                      - attachment_content_type
                      - medical_history_id
                      - attachment_file_url
                      - attachment_file_size
                      - created_at
                      - updated_at
                      - updater_name
                      - metadata
                      - attachment_file_original_url
                      additionalProperties: false
                      properties:
                        id:
                          type: integer
                        attachment_file_name:
                          type:
                          - string
                          - 'null'
                        attachment_file_name_alias:
                          type:
                          - string
                          - 'null'
                        consultation_id:
                          type:
                          - integer
                          - 'null'
                        attachment_content_type:
                          type:
                          - string
                          - 'null'
                        medical_history_id:
                          type: integer
                        attachment_file_url:
                          type: string
                        attachment_file_original_url:
                          type: string
                        attachment_file_size:
                          type:
                          - integer
                          - 'null'
                        created_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        updated_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        updater_name:
                          type: string
                        metadata:
                          type: object
                          additionalProperties: true
        '401':
          description: Missing, expired, invalid, or unauthorized patient portal token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        '404':
          description: The requested resource was not found or is outside the authorized
            patient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
              examples:
                not_found:
                  value:
                    error: Not found
  "/api/v1/patient_portal/people/{person_id}/consultations":
    get:
      tags:
      - Patient Portal
      operationId: listPatientPortalPersonConsultations
      summary: List authorized patient consultations
      description: Returns consultation-history membership independently of booking
        eligibility. Each summary keeps its historical physician and exposes doctor_active
        so consumers can omit inactive physicians from "Mis médicos" without deleting
        clinical history. url_portal is non-null only when that physician is active,
        has a username and present schedule configuration, and has use_portal exactly
        true (missing defaults to true). Pagination defaults to page 1 and per_page
        10. Values above 100 are accepted and clamped to 100 before limit, offset
        and total_pages; nonpositive or nonnumeric page sizes use 10. Each summary
        adds nullable appointment timing independently of the unchanged clinical starts_at,
        plus organization and location from the encounter's recorded location, including
        inactive branches. Missing, foreign-patient or soft-deleted encounters or
        locations return null organization/location fields without removing the consultation.
        Foreign encounter causes are not exposed. Canceled schedules remain history
        but never supply appointment timing. Default names and empty values are preserved.
        organization_name retains its existing physician-account meaning. These reads
        do not change stored data.
      security:
      - PatientPortalToken: []
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: integer
        example: 123
      - name: include
        in: query
        description: Exact encounter opt-in adds nullable encounter_id. Omitted or
          unrecognized values preserve the existing response field set and all existing
          IDs and meanings.
        required: false
        schema:
          type: string
        example: encounter
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: per_page
        in: query
        required: false
        description: Requested page size; values above 100 are accepted and clamped
          to 100 before limit, offset and total_pages calculations. Nonpositive handling
          is operation-specific.
        schema:
          type: integer
          minimum: 1
          default: 10
        example: 10
      responses:
        '200':
          description: Paginated non-deleted consultations ordered by starts_at descending.
            Private causes are masked. Inactive physicians remain in consultation
            history with doctor_active false and url_portal null; consumers omit them
            only from physician-card membership.
          content:
            application/json:
              schema:
                type: object
                required:
                - consultations
                - meta
                additionalProperties: false
                properties:
                  consultations:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - cause
                      - starts_at
                      - appointment
                      - doctor_name
                      - doctor_speciality_es
                      - doctor_speciality_en
                      - organization_name
                      - organization
                      - location
                      - doctor_speciality
                      - doctor_active
                      - url_portal
                      additionalProperties: false
                      properties:
                        encounter_id:
                          type:
                          - integer
                          - 'null'
                          description: Present only with include=encounter; owned
                            kept encounter identity, otherwise null.
                        appointment:
                          type:
                          - object
                          - 'null'
                          description: The single eligible schedule attached to the
                            same patient's kept encounter, independently of the clinical
                            start timestamp. Only kept, noncanceled schedules are
                            eligible. Accepted cancellations remain in schedule history
                            but never supply this appointment context; unrelated,
                            deleted and ambiguous eligible schedules return null.
                            This is the currently stored appointment time, not an
                            immutable original-booking snapshot. No cause, internal
                            metadata or command permission is added here.
                          additionalProperties: false
                          required:
                          - id
                          - starts_at
                          - ends_at
                          - time_zone
                          - schedule_type
                          properties:
                            id:
                              type: integer
                            starts_at:
                              type:
                              - string
                              - 'null'
                              format: date-time
                            ends_at:
                              type:
                              - string
                              - 'null'
                              format: date-time
                            time_zone:
                              type: string
                              description: Validated effective IANA timezone, with
                                America/Monterrey fallback.
                            schedule_type:
                              type:
                              - string
                              - 'null'
                        id:
                          type: integer
                        cause:
                          type:
                          - string
                          - 'null'
                        starts_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        doctor_name:
                          type:
                          - string
                          - 'null'
                        doctor_speciality_es:
                          type:
                          - string
                          - 'null'
                        doctor_speciality_en:
                          type:
                          - string
                          - 'null'
                        organization_name:
                          type:
                          - string
                          - 'null'
                          description: Physician account's current organization name;
                            retained for compatibility.
                        organization:
                          type:
                          - object
                          - 'null'
                          description: Organization of the recorded location on the
                            same patient's kept encounter, independently of the physician
                            account's current organization. Null when the encounter
                            or location is absent or soft-deleted, or the organization
                            cannot be resolved. Never inferred from a sole/default
                            branch.
                          required:
                          - id
                          - name
                          additionalProperties: false
                          properties:
                            id:
                              type: integer
                            name:
                              type:
                              - string
                              - 'null'
                          example:
                            id: 101
                            name: Example Clinic
                        location:
                          type:
                          - object
                          - 'null'
